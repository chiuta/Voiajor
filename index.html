<script>

const M=(function(){

// ---- planete: elemente medii (Standish, 1800-2050) ----

const STARS_DEF=[
['Proxima Centauri',217.429,-62.680,4.2465,-3781.7,769.5,-22.2,'#ff8f70'],

const dot3=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
function lambertSolve(r1,r2,tof){const R1=norm(r1),R2=norm(r2),sm=Math.sqrt(GM);
  let dnu=Math.acos(clamp(dot3(r1,r2)/(R1*R2),-1,1));if(r1[0]*r2[1]-r1[1]*r2[0]<0)dnu=TWO_PI-dnu;

    for(let i=1;i<=N;i++){const s=L*Math.pow(i/N,2),q=[pS[0]+u[0]*s,pS[1]+u[1]*s,pS[2]+u[2]*s],v=Math.sqrt(vinf*vinf+2*GM/norm(q));

  let lo=0.3,hi=9;for(let k=0;k<70;k++){const mid=(lo+hi)/2;if(run(mid)>Ty)lo=mid;else hi=mid;}

at {1} (linear model + local galactic dynamics).","ap.l":"→ {0}","ap.t":"Closest approach to {0}","ap.x":"≈{0} ly between the probe and the star (model, approximate catalog values).","ap.star":"Star","ap.when":"When","ap.dist":"Distance","ap.lit":"Literature vs. model","ap.pair":"Probe · star","ap.litc":"Literature","ap.modc":"Model","ap.note":"Literature: NASA/JPL, via Wikipedia. Over light-year distances, an error of a few degrees in a probe's direction of motion changes the minimum distance by tenths of a light-year or more (for Sirius, over two light-years), so the model's values are only indicative.","ab.h1":"What the app shows","ab.p1":"The paths of the two Voyager probes from 1977 to a future up to 1 billion years away, at any scale: from Earth's orbit to the disk of the Milky Way. The 1 light-day circle (≈173 AU) is the milestone Voyager 1 is heading towards in 2026–2027.","ab.h2":"How it is computed","ab.p2":"<b>Planets:<\/b> mean Keplerian orbital elements (JPL, valid 1800–2050). <b>Until 5 Nov 2026:<\/b> ballistic arcs (heliocentric conics, the Lambert problem) from launch to each planet, on the actual flyby dates; gravity assists appear as sudden changes of speed at the planet. Then a straight line with solar gravitational deceleration, calibrated to reach the position of 5 Nov 2026. <b>After 2026:<\/b> inertial motion plus the Sun's correction, and over the long term the Galaxy's pull through the epicyclic (Hill) equations with Oort constants A=15.3 and B=−11.9 km/s/kpc and a vertical frequency of ≈0.08 rad/Myr. <b>Stars:<\/b> J2000 positions, parallax, proper motion and approximate radial velocity, propagated with the same dynamics.","ab.h3":"Limits","ab.p3":"The 2026 positions (distance, direction) are approximations; at light-year scales they differ from JPL ephemerides. No pull from other bodies and no trajectory corrections; planetary flybys are treated as points (patched conics). The galactic model is a linearization around the Sun's orbit: accurate over tens of millions of years, indicative from hundreds of millions of years onward, when the probes are kiloparsecs from the Sun. The dates for the end of transmission are estimates, not official predictions.","ab.h4":"Current date","ab.p4":"On start-up the app syncs with the device clock (“Real time” mode): relative dates (“ago”, “in”) and the “today” marker on the path refer to today. The probes' position is extrapolated from the last calibrated position (5 Nov 2026), valid for any later date; the “Now” button returns to real time at any moment.","ab.h5":"A specific moment","ab.p5":"The “📅 Date” button opens a window where you can pick an exact calendar date (time in UTC, from the launches to +1 billion years), an interval relative to today (“in 250 years”, “10 years ago”) or a quick moment. After you choose, “Play” continues from there, at 1 year per second. The page address gets a <b>#t=<\/b> marker that can be saved or sent.","ab.h6":"Controls","ab.p6":"Drag on the screen to rotate, wheel / pinch to zoom (this turns off auto-zoom), double-click to reset the angle. Space = play / pause. The “co-rotating” frame shows the path in the system that rotates with the Galaxy.","ab.h7":"The Golden Record","ab.p7":"Each probe carries a gold-plated copper disc with sounds and images of Earth, as a message for a possible discovery in the very distant future.","ab.src":"Mission data source: NASA/JPL. A single-file app that works without internet."},"ro":{"title":"VOIAJOR — Voyager 1 și 2, de la lansare în viitorul îndepărtat","desc":"Simulare detaliată a traseului sondelor Voyager 1 și 2, din 1977 până peste un miliard de ani, la orice scară.","brand":"Voyager 1 · Voyager 2 — de la lansare până în viitorul îndepărtat","b.data":"Date","b.opt":"Opțiuni","tab.tel":"Telemetrie","tab.ev":"Evenimente","tab.stars":"Stele","tab.about":"Despre","tel.note":"Mărimile se referă la momentul simulat. După 2026 totul este extrapolare.","ev.all":"Ambele","ev.both":"Ambele sonde","st.h1 lui Voyager 1, pe o traiectorie mai lentă.","ev.v2.jup":"≈570 000 km de centrul planetei.","ev.v2.sat":"≈101 000 km; asistență gravitațională spre Uranus.","ev.v2.ura":"≈81 500 km. Singura vizită a unei sonde.","ev.v2.nep":"≈4 950 km deasupra norilor; apoi Triton. Traiectoria coboară spre sud.","ev.v2.ts":"≈84 UA.","ev.v2.hp":"≈119 UA: a doua sondă în spațiul interstelar, cu instrumentul plasmatic funcțional.","ev.ld.l":"1 zi-lumină","ev.ldE.t":"1 zi-lumină de Pământ","ev.ldE.x":"Semnalul radio are nevoie de 24 de ore într-un sens. (Dată calculată de model; NASA a indicat noiembrie 2026 pentru acest reper.)","ev.ldS.t":"1 zi-lumină de Soare","ev.ldS.x":"≈173 UA față de Soare (heliocentric).","ev.sil.l":"≈ anii 2030","ev.sil.t":"Estimare: tăcerea radio","ev.sil.x":"Generatorii cu plutoniu scad cu ≈4 W/an; instrumentele se sting pe rând, iar sondele rămân fără transmisie. Datare orientativă.","ev.oort.l":"Norul Oort","ev.oortIn.t":"Intrare în Norul Oort interior","ev.v1.oortIn":"≈1 000 UA (peste ≈250 de ani).","ev.v2.oortIn":"≈1 000 UA.","ev.oortOut.l":"Oort exterior","ev.oortOut.t":"Norul Oort exterior","ev.v1.oortOut":"≈20 000 UA.","ev.ly.l":"1 an-lumină","ev.ly.t":"1 an-lumină de Soare","ev.ly.x":"63 241 UA.","ev.oortEdge.l":"Marginea Oort","ev.oortEdge.t":"Ieșirea din Norul Oort","ev.v1.oortEdge":"≈100 000 UA; traversarea durează ≈30 000 de ani.","ev.v2.oortEdge":"≈100 000 UA.","ev.p1m":"+1 milion de ani","ev.p10m":"+10 milioane de ani","ev.p100m":"+100 milioane de ani","ev.p1b":"+1 miliard de ani","ev.dyn":"V1 la {0} de Soare; V2 la {1} (model liniar + dinamică galactică locală).","ap.l":"→ {0}","ap.t":"Cea mai mică distanță față de {0}","ap.x":"≈{0} a.l. între sondă și stea (model, valori aproximative ale catalogului).","ap.star":"Stea","ap.when":"Când","ap.dist":"Distanță","ap.lit":"Literatură față de model","ap.pair":"Sondă · stea","ap.litc":"Literatură","ap.modc":"Model","ap.note":"Literatura: NASA/JPL, prin Wikipedia. Pe distanțe de ani-lumină, o abatere de câteva grade în direcția vitezei unei sonde schimbă distanța minimă cu zecimi de an-lumină sau mai mult (la Sirius, peste doi ani-lumină), așa că valorile modelului sunt orientative.","ab.h1":"Ce arată aplicația","ab.p1":"Traseul celor două sonde Voyager din 1977 până într-un viitor de până la 1 miliard de ani, la orice scară: de la orbita Pământului la discul Căii Lactee. Cercul de 1 zi-lumină (≈173 UA) este reperul spre care se îndreaptă Voyager 1 în 2026–2027.","ab.h2":"Cum e calculat","ab.p2":"<b>Planetele:<\/b> elemente orbitale kepleriene medii (JPL, valabile 1800–2050). <b>Până la 5 nov. 2026:<\/b> arce balistice (conice heliocentrice, problema Lambert) de la lansare la fiecare planetă, la datele reale ale zborurilor; asistențele gravitaționale apar ca schimbări bruște de viteză la planetă. Apoi o dreaptă cu frânare gravitațională solară, calibrată să ajungă în poziția din 5 nov. 2026. <b>După 2026:<\/b> mișcare inerțială plus corecția Soarelui, iar pe timp lung atracția Galaxiei prin ecuațiile epiciclice (Hill) cu constantele Oort A=15,3 și B=−11,9 km/s/kpc și frecvența verticală ≈0,08 rad/Mil. ani. <b>Stelele:<\/b> poziții J2000, paralaxă, mișcare proprie și viteză radială aproximative, propagate cu aceeași dinamică.","ab.h3":"Limite","ab.p3":"Pozițiile din 2026 (distanță, direcție) sunt aproximări; la scară de ani-lumină apar diferențe față de efemeridele JPL. Fără atracția altor corpuri și fără corecții de traiectorie; zborurile pe lângă planete sunt tratate ca puncte (conice îmbinate). Modelul galactic este o liniarizare în jurul orbitei Soarelui: precis pe zeci de milioane de ani, orientativ de la sute de milioane de ani în sus, când sondele ajung la kiloparseci de Soare. Datările despre sfârșitul transmisiei sunt estimări, nu predicții oficiale.","ab.h4":"Data curentă","ab.p4":"La pornire aplicația se sincronizează cu ceasul dispozitivului (modul „Timp real”): datele relative („acum”, „peste”) și marcajul „azi” de pe traseu se raportează la ziua de azi. Poziția sondelor se extrapolează din ultima poziție calibrată (5 nov. 2026), valabilă pentru orice dată ulterioară; butonul „Acum” revine oricând la timp real.","ab.h5":"Un moment anume","ab.p5":"Butonul „📅 Dată” deschide o fereastră în care poți alege o dată calendaristică exactă (oră în UTC, de la lansări până la +1 miliard de ani), un interval față de azi („peste 250 de ani”, „acum 10 ani”) sau un moment rapid. După alegere, „Redare” continuă de acolo, cu 1 an pe secundă. Adresa paginii primește un marcaj <b>#t=<\/b> care poate fi salvat sau trimis.","ab.h6":"Comenzi","ab.p6":"Trage pe ecran pentru a roti, rotița / ciupirea pentru zoom (oprește zoomul automat), dublu-clic pentru a reseta unghiul. Spațiu = redare / pauză. Cadrul „co-rotativ” arată traseul în sistemul care se învârte odată cu Galaxia.","ab.h7":"Discul de Aur","ab.p7":"Fiecare sondă poartă un disc de cupru placat cu aur, cu sunete și imagini de pe Pământ, ca mesaj pentru o eventuală descoperire în viitorul foarte îndepărtat.","ab.src":"Sursa datelor misiunii: NASA/JPL. Aplicație cu un singur fișier, funcționează fără internet."},"fr":{"title":"VOIAJOR — Voyager 1 et 2, du lancement au futur lointain","desc":"Simulation détaillée des trajectoires de Voyager 1 et 2, de 1977 à plus d’un milliard d’années dans le futur, à toutes les échelles.","brand":"Voyager 1 · Voyager 2 — du lancement au futur lointain","b.data":"Données","b.opt":"Options","tab.tel":"Télémétrie","tab.ev":"Événements","tab.stars":"Étoiles","tab.about":"À propos","tel.note":"Les valeurs se rapportent à l’instant simulé. Après 2026, tout est extrapolation.","ev.all":"Les deux","ev.both":"Les deux sondes","st.h1":"Approches les plus proches d’étoiles (modèle, à partir de 2026)","st.calc":"Calcul en cours…","st.h2":"Étoiles les plus proches du Soleil à l’instant simulé","o.h1":"Affichage","o.orb":"Orbites des planètes","o.lab":"Étiquettes","o.hel":"Héliosphère (choc terminal, héliopause)","o.oort":"Nuage d’Oort","o.star":"Étoiles proch ":"Lancée 16 jours avant Voyager 1, sur une trajectoire plus lente.","ev.v2.jup":"≈570 000 km du centre de la planète.","ev.v2.sat":"≈101 000 km ; assistance gravitationnelle vers Uranus.","ev.v2.ura":"≈81 500 km. Seule visite d’une sonde.","ev.v2.nep":"≈4 950 km au-dessus des nuages ; puis Triton. La trajectoire plonge vers le sud.","ev.v2.ts":"≈84 UA.","ev.v2.hp":"≈119 UA : deuxième sonde dans l’espace interstellaire, avec un instrument à plasma en état de marche.","ev.ld.l":"1 jour-lumière","ev.ldE.t":"1 jour-lumière de la Terre","ev.ldE.x":"Un signal radio met 24 heures à l’aller. (Date calculée par le modèle ; la NASA a indiqué novembre 2026 pour cette étape.)","ev.ldS.t":"1 jour-lumière du Soleil","ev.ldS.x":"≈173 UA du Soleil (héliocentrique).","ev.sil.l":"≈ années 2030","ev.sil.t":"Estimation : silence radio","ev.sil.x":"Les générateurs au plutonium perdent ≈4 W par an ; les instruments s’éteignent un à un, et les sondes finissent sans transmission. Datation approximative.","ev.oort.l":"Nuage d’Oort","ev.oortIn.t":"Entrée dans le nuage d’Oort interne","ev.v1.oortIn":"≈1 000 UA (dans ≈250 ans).","ev.v2.oortIn":"≈1 000 UA.","ev.oortOut.l":"Oort externe","ev.oortOut.t":"Le nuage d’Oort externe","ev.v1.oortOut":"≈20 000 UA.","ev.ly.l":"1 année-lumière","ev.ly.t":"1 année-lumière du Soleil","ev.ly.x":"63 241 UA.","ev.oortEdge.l":"Bord d’Oort","ev.oortEdge.t":"Sortie du nuage d’Oort","ev.v1.oortEdge":"≈100 000 UA ; la traversée dure ≈30 000 ans.","ev.v2.oortEdge":"≈100 000 UA.","ev.p1m":"+1 million d’années","ev.p10m":"+10 millions d’années","ev.p100m":"+100 millions d’années","ev.p1b":"+1 milliard d’années","ev.dyn":"V1 à {0} du Soleil ; V2 à {1} (modèle linéaire + dynamique galactique locale).","ap.l":"→ {0}","ap.t":"Approche la plus proche de {0}","ap.x":"≈{0} a.l. entre la sonde et l’étoile (modèle, valeurs approximatives du catalogue).","ap.star":"Étoile","ap.when":"Quand","ap.dist":"Distance","ap.lit":"Littérature vs modèle","ap.pair":"Sonde · étoile","ap.litc":"Littérature","ap.modc":"Modèle","ap.note":"Littérature : NASA/JPL, via Wikipédia. À des distances de l’ordre de l’année-lumière, une erreur de quelques degrés sur la direction de déplacement d’une sonde modifie la distance minimale de quelques dixièmes d’année-lumière, voire plus (pour Sirius, plus de deux années-lumière) ; les valeurs du modèle ne sont donc qu’indicatives.","ab.h1":"Ce que montre l’application","ab.p1":"Les trajectoires des deux sondes Voyager de 1977 jusqu’à un futur situé à 1 milliard d’années, à toutes les échelles : de l’orbite terrestre au disque de la Voie lactée. Le cercle de 1 jour-lumière (≈173 UA) est l’étape vers laquelle Voyager 1 se dirige en 2026–2027.","ab.h2":"Comment c’est calculé","ab.p2":"<b>Planètes :<\/b> éléments orbitaux képlériens moyens (JPL, valables 1800–2050). <b>Jusqu’au 5 nov. 2026 :<\/b> arcs balistiques (coniques héliocentriques, problème de Lambert) du lancement à chaque planète, aux dates réelles de survol ; les assistances gravitationnelles apparaissent comme des changements brusques de vitesse à la planète. Ensuite, une droite avec décélération due à la gravité solaire, calibrée pour atteindre la position du 5 nov. 2026. <b>Après 2026 :<\/b> mouvement inertiel plus la correction du Soleil, et, à long terme, l’attraction de la Galaxie par les équations épicycliques (de Hill) avec les constantes d’Oort A=15,3 et B=−11,9 km/s/kpc et une fréquence verticale de ≈0,08 rad/Ma. <b>Étoiles :<\/b> positions J2000, parallaxe, mouvement propre et vitesse radiale approximative, propagées avec la même dynamique.","ab.h3":"Limites","ab.p3":"Les positions de 2026 (distance, direction) sont des approximations ; aux échelles de l’année-lumière, elles diffèrent des éphémérides du JPL. Aucune attraction d’autres corps et aucune correction de trajectoire ; les survols planétaires sont traités comme des points (coniques raccordées). Le modèle galactique est une linéarisation autour de l’orbite du Soleil : précis sur des dizaines de millions d’années, indicatif à partir de centaines de millions d’années, lorsque les sondes se trouvent à des kiloparsecs du Soleil. Les dates de fin de transmission sont des estimations, non des prévisions officielles.","ab.h4":"Date actuelle","ab.p4":"Au démarrage, l’application se synchronise avec l’horloge de l’appareil (mode “Temps réel”) : les dates relatives (“il y a”, “dans”) et le repère “aujourd’hui” sur la trajectoire se rapportent à aujourd’hui. La position des sondes est extrapolée à partir de la dernière position calibrée (5 nov. 2026), valable pour toute date ultérieure ; le bouton “Maintenant” ramène au temps réel à tout moment.","ab.h5":"Un instant précis","ab.p5":"Le bouton “📅 Date” ouvre une fenêtre où vous pouvez choisir une date exacte du calendrier (heure en UTC, des lancements à +1 milliard d’années), un intervalle relatif à aujourd’hui (“dans 250 ans”, “il y a 10 ans”) ou un instant rapide. Après votre choix, “Lecture” continue à partir de là, à 1 an par seconde. L’adresse de la page reçoit un marqueur <b>#t=<\/b> qui peut être enregistré ou envoyé.","ab.h6":"Commandes","ab.p6":"Faites glisser sur l’écran pour pivoter, molette / pincement pour zoomer (cela désactive le zoom auto), double-clic pour réinitialiser l’angle. Espace = lecture / pause. Le repère “co-rotatif” montre la trajectoire dans le système qui tourne avec la Galaxie.","ab.h7":"Le Disque d’or","ab.p7":"Chaque sonde emporte un disque de cuivre plaqué or contenant des sons et des images de la Terre, comme message pour une éventuelle découverte dans un futur très lointain.","ab.src":"Source des données de mission : NASA/JPL. Application en un seul fichier, fonctionnant sans internet."},"it":{"title":"VOIAJOR — Voyager 1 e 2, dal lancio al lontano futuro","desc":"Simulazione dettagliata delle traiettorie delle sonde Voyager 1 e 2, dal 1977 a oltre un miliardo di anni da oggi, a qualsiasi scala.","brand":"Voyager 1 · Voyager 2 — dal lancio al lontano futuro","b.data":"Dati","b.op »","ev.pbd.x":"Il ritratto di famiglia dei pianeti, da ≈40 UA.","ev.rec.l":"Record","ev.rec.t":"L’oggetto costruito dall’uomo più lontano","ev.rec.x":"Supera Pioneer 10 (≈69 UA).","ev.ts.t":"L’onda d’urto di terminazione","ev.v1.ts":"≈94 UA: il vento solare rallenta bruscamente.","ev.hp.t":"L’eliopausa","ev.v1.hp":"≈121,6 UA: la prima sonda a entrare nello spazio interstellare.","ev.v2.launch":"Lanciata 16 giorni prima di Voyager 1, su una traiettoria più lenta.","ev.v2.jup":"≈570.000 km dal centro del pianeta.","ev.v2.sat":"≈101.000 km; fionda gravitazionale verso Urano.","ev.v2.ura":"≈81.500 km. L’unica visita di una sonda.","ev.v2.nep":"≈4.950 km sopra le nubi; poi Triton. La traiettoria scende verso sud.","ev.v2.ts":"≈84 UA.","ev.v2.hp":"≈119 UA: la seconda sonda nello spazio interstellare, con lo strumento al plasma funzionante.","ev.ld.l":"1 giorno luce","ev.ldE.t":"1 giorno luce dalla Terra","ev.ldE.x":"Un segnale radio impiega 24 ore in un solo senso. (Data calcolata dal modello; la NASA ha indicato novembre 2026 per questo traguardo.)","ev.ldS.t":"1 giorno luce dal Sole","ev.ldS.x":"≈173 UA dal Sole (eliocentrica).","ev.sil.l":"≈ anni 2030","ev.sil.t":"Stima: silenzio radio","ev.sil.x":"I generatori al plutonio perdono ≈4 W all’anno; gli strumenti si spengono uno dopo l’altro e le sonde restano senza trasmissione. Datazione indicativa.","ev.oort.l":"Nube di Oort","ev.oortIn.t":"Ingresso nella Nube di Oort interna","ev.v1.oortIn":"≈1.000 UA (tra ≈250 anni).","ev.v2.oortIn":"≈1.000 UA.","ev.oortOut.l":"Oort esterna","ev.oortOut.t":"La Nube di Oort esterna","ev.v1.oortOut":"≈20.000 UA.","ev.ly.l":"1 anno luce","ev.ly.t":"1 anno luce dal Sole","ev.ly.x":"63.241 UA.","ev.oortEdge.l":"Margine Oort","ev.oortEdge.t":"Uscita dalla Nube di Oort","ev.v1.oortEdge":"≈100.000 UA; l’attraversamento dura ≈30.000 anni.","ev.v2.oortEdge":"≈100.000 UA.","ev.p1m":"+1 milione di anni","ev.p10m":"+10 milioni di anni","ev.p100m":"+100 milioni di anni","ev.p1b":"+1 miliardo di anni","ev.dyn":"V1 a {0} dal Sole; V2 a {1} (modello lineare + dinamica galattica locale).","ap.l":"→ {0}","ap.t":"Massimo avvicinamento a {0}","ap.x":"≈{0} a.l. tra la sonda e la stella (modello, valori di catalogo approssimati).","ap.star":"Stella","ap.when":"Quando","ap.dist":"Distanza","ap.lit":"Letteratura e modello","ap.pair":"Sonda · stella","ap.litc":"Letteratura","ap.modc":"Modello","ap.note":"Letteratura: NASA/JPL, tramite Wikipedia. Su distanze di anni luce, un errore di pochi gradi nella direzione di moto di una sonda cambia la distanza minima di alcuni decimi di anno luce o più (per Sirio, oltre due anni luce), quindi i valori del modello sono solo indicativi.","ab.h1":"Cosa mostra l’app","ab.p1":"Le traiettorie delle due sonde Voyager dal 1977 a un futuro fino a 1 miliardo di anni da oggi, a qualsiasi scala: dall’orbita della Terra al disco della Via Lattea. Il cerchio di 1 giorno luce (≈173 UA) è il traguardo verso cui si dirige Voyager 1 nel 2026–2027.","ab.h2":"Come viene calcolato","ab.p2":"<b>Pianeti:<\/b> elementi orbitali kepleriani medi (JPL, validi 1800–2050). <b>Fino al 5 nov 2026:<\/b> archi balistici (coniche eliocentriche, problema di Lambert) dal lancio a ciascun pianeta, alle date reali dei sorvoli; le fionde gravitazionali appaiono come bruschi cambi di velocità al pianeta. Poi una retta con decelerazione gravitazionale solare, calibrata per raggiungere la posizione del 5 nov 2026. <b>Dopo il 2026:<\/b> moto inerziale più la correzione del Sole e, sui tempi lunghi, l’attrazione della Galassia tramite le equazioni epicicliche di Hill con le costanti di Oort A=15,3 e B=−11,9 km/s/kpc e una frequenza verticale di ≈0,08 rad/Mln di anni. <b>Stelle:<\/b> posizioni J2000, parallasse, moto proprio e velocità radiale approssimata, propagati con la stessa dinamica.","ab.h3":"Limiti","ab.p3":"Le posizioni del 2026 (distanza, direzione) sono approssimazioni; a scala di anni luce differiscono dalle effemeridi JPL. Nessuna attrazione da altri corpi e nessuna correzione di traiettoria; i sorvoli planetari sono trattati come punti (coniche raccordate). Il modello galattico è una linearizzazione attorno all’orbita del Sole: accurato su decine di milioni di anni, indicativo da centinaia di milioni di anni in poi, quando le sonde si trovano a kiloparsec dal Sole. Le date della fine delle trasmissioni sono stime, non previsioni ufficiali.","ab.h4":"Data corrente","ab.p4":"All’avvio l’app si sincronizza con l’orologio del dispositivo (modalità «Tempo reale»): le date relative («fa», «tra») e il segnaposto «oggi» sulla traiettoria si riferiscono a oggi. La posizione delle sonde è estrapolata dall’ultima posizione calibrata (5 nov 2026), valida per qualsiasi data successiva; il pulsante «Adesso» riporta in qualsiasi momento al tempo reale.","ab.h5":"Un istante preciso","ab.p5":"Il pulsante «📅 Data» apre una finestra in cui puoi scegliere una data di calendario esatta (ora in UTC, dai lanci a +1 miliardo di anni), un intervallo rispetto a oggi («tra 250 anni», «10 anni fa») o un istante rapido. Dopo la scelta, «Riproduci» continua da lì, a 1 anno al secondo. L’indirizzo della pagina riceve un marcatore <b>#t=<\/b> che si può salvare o inviare.","ab.h6":"Controlli","ab.p6":"Trascina sullo schermo per ruotare, rotellina / pizzico per lo zoom (disattiva lo zoom automatico), doppio clic per reimpostare l’angolo. Spazio = riproduci / pausa. Il riferimento «co-rotante» mostra la traiettoria nel sistema che ruota insieme alla Galassia.","ab.h7":"Il Golden Record","ab.p7":"Ogni sonda porta un disco di rame placcato in oro con suoni e immagini della Terra, come messaggio per un’eventuale scoperta in un futuro lontanissimo.","ab.src":"Fonte dei dati della missione: NASA/JPL. App in un unico file, funziona senza internet."},"es":{"title":"VOIAJOR — Voyager 1 y 2, del lanzamiento al futuro lejano","desc":"Simulación detallada de las trayectorias de las sondas Voyager 1 y 2, desde 1977 hasta más de mil millones de años en el futuro, a c 1.jup":"Paso más cercano: ≈349 000 km del centro del planeta. Descubre el vulcanismo de Io.","ev.v1.sat":"≈124 000 km. Sobrevuela Titán; la trayectoria asciende por encima del plano de los planetas.","ev.pbd.l":"Pale Blue Dot","ev.pbd.t":"«Pale Blue Dot»","ev.pbd.x":"El retrato de familia de los planetas, desde ≈40 UA.","ev.rec.l":"Récord","ev.rec.t":"El objeto fabricado por el ser humano más lejano","ev.rec.x":"Supera a la Pioneer 10 (≈69 UA).","ev.ts.t":"El choque de terminación","ev.v1.ts":"≈94 UA: el viento solar se frena bruscamente.","ev.hp.t":"La heliopausa","ev.v1.hp":"≈121,6 UA: la primera sonda que entra en el espacio interestelar.","ev.v2.launch":"Lanzada 16 días antes que la Voyager 1, en una trayectoria más lenta.","ev.v2.jup":"≈570 000 km del centro del planeta.","ev.v2.sat":"≈101 000 km; asistencia gravitatoria hacia Urano.","ev.v2.ura":"≈81 500 km. La única visita de una sonda.","ev.v2.nep":"≈4950 km sobre las nubes; después, Tritón. La trayectoria desciende hacia el sur.","ev.v2.ts":"≈84 UA.","ev.v2.hp":"≈119 UA: la segunda sonda en el espacio interestelar, con el instrumento de plasma en funcionamiento.","ev.ld.l":"1 día luz","ev.ldE.t":"1 día luz de la Tierra","ev.ldE.x":"Una señal de radio tarda 24 horas en un sentido. (Fecha calculada por el modelo; la NASA indicó noviembre de 2026 para este hito.)","ev.ldS.t":"1 día luz del Sol","ev.ldS.x":"≈173 UA del Sol (heliocéntrico).","ev.sil.l":"≈ años 2030","ev.sil.t":"Estimación: silencio de radio","ev.sil.x":"Los generadores de plutonio pierden ≈4 W al año; los instrumentos se apagan uno tras otro y las sondas se quedan sin transmisión. Datación orientativa.","ev.oort.l":"Nube de Oort","ev.oortIn.t":"Entrada en la Nube de Oort interior","ev.v1.oortIn":"≈1000 UA (dentro de ≈250 años).","ev.v2.oortIn":"≈1000 UA.","ev.oortOut.l":"Oort exterior","ev.oortOut.t":"La Nube de Oort exterior","ev.v1.oortOut":"≈20 000 UA.","ev.ly.l":"1 año luz","ev.ly.t":"1 año luz del Sol","ev.ly.x":"63 241 UA.","ev.oortEdge.l":"Borde de Oort","ev.oortEdge.t":"Salida de la Nube de Oort","ev.v1.oortEdge":"≈100 000 UA; la travesía dura ≈30 000 años.","ev.v2.oortEdge":"≈100 000 UA.","ev.p1m":"+1 millón de años","ev.p10m":"+10 millones de años","ev.p100m":"+100 millones de años","ev.p1b":"+1000 millones de años","ev.dyn":"V1 a {0} del Sol; V2 a {1} (modelo lineal + dinámica galáctica local).","ap.l":"→ {0}","ap.t":"Máximo acercamiento a {0}","ap.x":"≈{0} a. l. entre la sonda y la estrella (modelo, valores aproximados del catálogo).","ap.star":"Estrella","ap.when":"Cuándo","ap.dist":"Distancia","ap.lit":"Bibliografía y modelo","ap.pair":"Sonda · estrella","ap.litc":"Bibliografía","ap.modc":"Modelo","ap.note":"Bibliografía: NASA/JPL, a través de Wikipedia. A distancias de años luz, un error de unos pocos grados en la dirección de movimiento de una sonda cambia la distancia mínima en décimas de año luz o más (en el caso de Sirio, más de dos años luz), por lo que los valores del modelo son meramente orientativos.","ab.h1":"Qué muestra la aplicación","ab.p1":"Las trayectorias de las dos sondas Voyager desde 1977 hasta un futuro de hasta 1000 millones de años, a cualquier escala: de la órbita de la Tierra al disco de la Vía Láctea. El círculo de 1 día luz (≈173 UA) es el hito hacia el que se dirige la Voyager 1 en 2026–2027.","ab.h2":"Cómo se calcula","ab.p2":"<b>Planetas:<\/b> elementos orbitales keplerianos medios (JPL, válidos de 1800 a 2050). <b>Hasta el 5 nov. 2026:<\/b> arcos balísticos (cónicas heliocéntricas, problema de Lambert) desde el lanzamiento hasta cada planeta, en las fechas reales de los sobrevuelos; las asistencias gravitatorias aparecen como cambios bruscos de velocidad en el planeta. Después, una recta con deceleración por la gravedad solar, calibrada para alcanzar la posición del 5 nov. 2026. <b>Después de 2026:<\/b> movimiento inercial más la corrección del Sol y, a largo plazo, la atracción de la Galaxia mediante las ecuaciones epicíclicas de Hill, con las constantes de Oort A=15,3 y B=−11,9 km/s/kpc y una frecuencia vertical de ≈0,08 rad/Ma. <b>Estrellas:<\/b> posiciones J2000, paralaje, movimiento propio y velocidad radial aproximada, propagados con la misma dinámica.","ab.h3":"Límites","ab.p3":"Las posiciones de 2026 (distancia, dirección) son aproximaciones; a escala de años luz difieren de las efemérides del JPL. No se incluye la atracción de otros cuerpos ni correcciones de trayectoria; los sobrevuelos planetarios se tratan como puntos (cónicas empalmadas). El modelo galáctico es una linealización en torno a la órbita del Sol: preciso durante decenas de millones de años, orientativo a partir de cientos de millones de años, cuando las sondas están a kiloparsecs del Sol. Las fechas del fin de la transmisión son estimaciones, no predicciones oficiales.","ab.h4":"Fecha actual","ab.p4":"Al iniciarse, la aplicación se sincroniza con el reloj del dispositivo (modo «Tiempo real»): las fechas relativas («hace», «dentro de») y la marca «hoy» de la trayectoria se refieren al día de hoy. La posición de las sondas se extrapola a partir de la última posición calibrada (5 nov. 2026), válida para cualquier fecha posterior; el botón «Ahora» vuelve al tiempo real en cualquier momento.","ab.h5":"Un momento concreto","ab.p5":"El botón «📅 Fecha» abre una ventana en la que puedes elegir una fecha exacta del calendario (hora en UTC, desde los lanzamientos hasta +1000 millones de años), un intervalo respecto a hoy («dentro de 250 años», «hace 10 años») o un momento rápido. Tras elegir, «Reproducir» continúa desde ahí, a 1 año por segundo. La dirección de la página recibe una marca <b>#t=<\/b> que se puede guardar o enviar.","ab.h6":"Controles","ab.p6":"Arrastra por la pantalla para girar, rueda / pellizco para el zoom (esto desactiva el zoom automático), doble clic para restablecer el ángulo. Espacio = reproducir / pausa. El sistema «en corrotación» muestra la trayectoria en el sistema que gira junto con la Galaxia.","ab.h7":"El Disco de Oro","ab.p7":"Cada sonda lleva un disco de cobre chapado en oro con sonidos e imágenes de la Tierra, como mensaje para un posible hallazgo en un futuro muy lejano.","ab.src":"Fuente de los datos de la misión: NASA/JPL. Aplicación de un solo archivo que funciona sin internet."},"pt":{"title":"VOIAJOR — Voyager 1 e 2, do lançamento ao futuro distante","desc":"Simulação detalhada das trajetórias das sondas Voyager 1 e 2, de 1977 até mais de mil milhões de anos no futuro, a qualquer escala.","brand":"Voyager 1 · Voyager 2 — do lançamento ao futuro distante","b.data":"Dados","b.opt":"Opções","tab.tel":"Telemetria","tab.ev":"Eventos","tab.stars":"Estrelas","tab.about":"Sobre","tel.note":"Os valores referem-se ao momento simulado. Depois de 2026, tudo é extrapolação.","ev.all":"Ambas","ev.both":"Ambas as sondas","st.h1":"Maiores aproximações a estrelas (modelo, a partir de 2026)","st.calc":"A calcular…","st.h2":"Estrelas mais próximas do Sol no momento simulado","o.h1":"Visualização","o.orb":"Órbitas dos planetas","o.lab":"Legendas","o.hel":"Heliosfera (onda de choque de terminação, heliopausa)","o.oort":"Nuvem de Oort","o.star":"Estrelas próximas","o.ring":"Círculos de distância (dias-luz, anos-luz)","o.fut":"Trajetória futura (a tracejado)","o.gal":"Galáxia (em grandes escalas)","o.auto":"Zoom automático (segue as sondas)","o.cor":"Referencial em co-rotação com a Galáxia","o.h2":"Centro da vista","o.sun":"O Sol","o.mid":"Ponto médio entre as sondas","o.reset":"Repor o ângulo de vista","o.lang":"Idioma","g.title":"Ir para um momento específico","g.close":"Fechar","g.date":"Data do calendário (hora em UTC)","g.day":"Dia","g.month":"Mês","g.year":"Ano","g.hour":"Hora","g.go":"Ir para a data","g.rel":"Relativo a hoje","g.after":"daqui a","g.before":"há","g.ud":"dias","g.umo":"meses","g.uy":"anos","g.uky":"milhares de anos","g.umy":"milhões de anos","g.uby":"mil milhões de anos","g.go2":"Ir","g.quick":"Momentos rápidos","g.bad":"Valor inválido.","g.pre":"Antes dos lançamentos não havia sond o visível ≈ {0}","rg.h":"1 hora-luz","rg.d":"1 dia-luz","rg.w":"1 semana-luz","rg.m":"1 mês-luz","rg.y":"1 ano-luz","pl.0":"Mercúrio","pl.1":"Vénus","pl.2":"Terra","pl.3":"Marte","pl.4":"Júpiter","pl.5":"Saturno","pl.6":"Úrano","pl.7":"Neptuno","st.barnard":"Estrela de Barnard","ev.launch":"Lançamento","ev.v1.launch":"Cabo Canaveral, foguetão Titan IIIE–Centaur. Transporta o Disco de Ouro.","ev.v1.jup":"Passagem mais próxima: ≈349 000 km do centro do planeta. Descobre o vulcanismo em Io.","ev.v1.sat":"≈124 000 km. Sobrevoa Titã; a trajetória sobe acima do plano dos planetas.","ev.pbd.l":"Pálido Ponto Azul","ev.pbd.t":"«Pálido Ponto Azul»","ev.pbd.x":"O retrato de família dos planetas, a ≈40 UA.","ev.rec.l":"Recorde","ev.rec.t":"Objeto feito pelo ser humano mais distante","ev.rec.x":"Ultrapassa a Pioneer 10 (≈69 UA).","ev.ts.t":"A onda de choque de terminação","ev.v1.ts":"≈94 UA: o vento solar abranda bruscamente.","ev.hp.t":"A heliopausa","ev.v1.hp":"≈121,6 UA: a primeira sonda a entrar no espaço interestelar.","ev.v2.launch":"Lançada 16 dias antes da Voyager 1, numa trajetória mais lenta.","ev.v2.jup":"≈570 000 km do centro do planeta.","ev.v2.sat":"≈101 000 km; assistência gravitacional rumo a Úrano.","ev.v2.ura":"≈81 500 km. A única visita de uma sonda.","ev.v2.nep":"≈4950 km acima das nuvens; depois, Tritão. A trajetória inclina-se para sul.","ev.v2.ts":"≈84 UA.","ev.v2.hp":"≈119 UA: a segunda sonda no espaço interestelar, com um instrumento de plasma em funcionamento.","ev.ld.l":"1 dia-luz","ev.ldE.t":"1 dia-luz da Terra","ev.ldE.x":"Um sinal de rádio demora 24 horas num sentido. (Data calculada pelo modelo; a NASA indicou novembro de 2026 para este marco.)","ev.ldS.t":"1 dia-luz do Sol","ev.ldS.x":"≈173 UA do Sol (heliocêntrico).","ev.sil.l":"≈ anos 2030","ev.sil.t":"Estimativa: silêncio rádio","ev.sil.x":"Os geradores de plutónio perdem ≈4 W por ano; os instrumentos desligam-se um a um e as sondas ficam sem transmissão. Datação aproximada.","ev.oort.l":"Nuvem de Oort","ev.oortIn.t":"Entrada na Nuvem de Oort interior","ev.v1.oortIn":"≈1000 UA (dentro de ≈250 anos).","ev.v2.oortIn":"≈1000 UA.","ev.oortOut.l":"Oort exterior","ev.oortOut.t":"A Nuvem de Oort exterior","ev.v1.oortOut":"≈20 000 UA.","ev.ly.l":"1 ano-luz","ev.ly.t":"1 ano-luz do Sol","ev.ly.x":"63 241 UA.","ev.oortEdge.l":"Limite de Oort","ev.oortEdge.t":"Saída da Nuvem de Oort","ev.v1.oortEdge":"≈100 000 UA; a travessia demora ≈30 000 anos.","ev.v2.oortEdge":"≈100 000 UA.","ev.p1m":"+1 milhão de anos","ev.p10m":"+10 milhões de anos","ev.p100m":"+100 milhões de anos","ev.p1b":"+1 mil milhões de anos","ev.dyn":"V1 a {0} do Sol; V2 a {1} (modelo linear + dinâmica galáctica local).","ap.l":"→ {0}","ap.t":"Maior aproximação a {0}","ap.x":"≈{0} a.l. entre a sonda e a estrela (modelo, valores aproximados do catálogo).","ap.star":"Estrela","ap.when":"Quando","ap.dist":"Distância","ap.lit":"Literatura vs. modelo","ap.pair":"Sonda · estrela","ap.litc":"Literatura","ap.modc":"Modelo","ap.note":"Literatura: NASA/JPL, via Wikipédia. A distâncias de anos-luz, um erro de poucos graus na direção de movimento de uma sonda altera a distância mínima em décimas de ano-luz ou mais (para Sírio, mais de dois anos-luz), pelo que os valores do modelo são meramente indicativos.","ab.h1":"O que a aplicação mostra","ab.p1":"Os percursos das duas sondas Voyager de 1977 até um futuro a 1 mil milhões de anos, a qualquer escala: da órbita da Terra ao disco da Via Láctea. O círculo de 1 dia-luz (≈173 UA) é o marco para o qual a Voyager 1 se dirige em 2026–2027.","ab.h2":"Como é calculado","ab.p2":"<b>Planetas:<\/b> elementos orbitais keplerianos médios (JPL, válidos para 1800–2050). <b>Até 5 nov 2026:<\/b> arcos balísticos (cónicas heliocêntricas, problema de Lambert) do lançamento a cada planeta, nas datas reais de sobrevoo; as assistências gravitacionais surgem como variações bruscas de velocidade junto ao planeta. Depois, uma reta com desaceleração gravitacional solar, calibrada para atingir a posição de 5 nov 2026. <b>Após 2026:<\/b> movimento inercial com a correção do Sol e, a longo prazo, a atração da Galáxia através das equações epicíclicas de Hill, com as constantes de Oort A=15,3 e B=−11,9 km/s/kpc e uma frequência vertical de ≈0,08 rad/Ma. <b>Estrelas:<\/b> posições J2000, paralaxe, movimento próprio e velocidade radial aproximada, propagados com a mesma dinâmica.","ab.h3":"Limites","ab.p3":"As posições de 2026 (distância, direção) são aproximações; à escala de anos-luz diferem das efemérides do JPL. Não se consideram a atração de outros corpos nem correções de trajetória; os sobrevoos planetários são tratados como pontos (cónicas ajustadas). O modelo galáctico é uma linearização em torno da órbita do Sol: preciso ao longo de dezenas de milhões de anos, indicativo a partir de centenas de milhões de anos, quando as sondas estão a quiloparsecs do Sol. As datas do fim das transmissões são estimativas, não previsões oficiais.","ab.h4":"Data atual","ab.p4":"Ao iniciar, a aplicação sincroniza-se com o relógio do dispositivo (modo «Tempo real»): as datas relativas («há», «daqui a») e a marca «hoje» no percurso referem-se ao dia de hoje. A posição das sondas é extrapolada a partir da última posição calibrada (5 nov 2026), válida para qualquer data posterior; o botão «Agora» regressa ao tempo real em qualquer momento.","ab.h5":"Um momento específico","ab.p5":"O botão «📅 Data» abre uma janela onde pode escolher uma data exata do calendário (hora em UTC, dos lançamentos a +1 mil milhões de anos), um intervalo relativo a hoje («daqui a 250 anos», «há 10 anos») ou um momento rápido. Depois de escolher, «Reproduzir» continua a partir daí, a 1 ano por segundo. O endereço da página ganha um marcador <b>#t=<\/b> que pode ser guardado ou enviado.","ab.h6":"Controlos","ab.p6":"Arraste no ecrã para rodar, roda do rato / pinça para ampliar (isto desativa o zoom automático), duplo clique para repor o ângulo. Espaço = reproduzir / pausar. O referencial «em co-rotação» mostra o percurso no sistema que roda com a Galáxia.","ab.h7":"O Disco de Ouro","ab.p7":"Cada sonda transporta um disco de cobre banhado a ouro com sons e imagens da Terra, como mensagem para uma possível descoberta num futuro muito distante.","ab.src":"Fonte dos dados da missão: NASA/JPL. Aplicação de ficheiro único que funciona sem internet."},"de":{"title":"VOIAJOR — Voyager 1 und 2, vom Start bis in die ferne Zukunft","desc":"Eine detaillierte Simulation der Bahnen von Voyager 1 und 2, von 1977 bis über eine Milliarde Jahre in die Zukunft, in jedem Maßstab.","brand":"Voyager 1 · Voyager 2 — vom Start bis in die ferne Zukunft","b.data":"Daten","b.opt":"Optionen","tab.tel":"Telemetrie","tab.ev":"Ereignisse","tab.stars":"Sterne","tab.about":"Info","tel.note":"Die Werte beziehen sich auf den simulierten Zeitpunkt. Nach 2026 ist alles Extrapolation.","ev.all":"Beide","ev.both":"Beide Sonden","st.h1":"Größte Annäherungen an Sterne (Modell, ab 2026)","st.calc":"Berechnung…","st.h2":"Der Sonne nächste Sterne zum simulierten Zeitpunkt","o.h1":"Anzeige","o.orb":"Planetenbahnen","o.lab":"Beschriftungen","o.hel":"Heliosphäre (Termination Shock, Heliopause)","o.oort":"Oortsche Wolke","o.star":"Nahe Sterne","o.ring":"Entfernungskreise (Lichttage, Lichtjahre)","o.fut":"Künftige Bahn (gepunktet)","o.gal":"Galaxis (bei großen Maßstäben)","o.auto":"Auto-Zoom (folgt den Sonden)","o.cor":"Mit der Galaxis mitrotierendes System","o.h2":"Bildmitte","o.sun":"Die Sonne","o.mid":"Mitte zwischen den Sonden","o.reset":"Blickwinkel zurücksetzen","o.lang":"Sprache","g.title":"Zu einem bestimmten Zeitpunkt","g.close":"Schließen","g.date":"Kalenderdatum (Uhrzeit in UTC)","g.day":"Tag","g.month":"Monat","g.year":"Jahr","g.hour":"Uhrzeit","g.go":"Zum Datum","g.rel":"Relativ zu heute","g.after":"in","g.before":"vor","g.ud":"Tagen","g.umo":"Monaten","g.uy":"Jahren","g.uky":"Tausend Jahren","g.umy":"Mio. Jahren","g.uby":"Mrd. Jahren","g.go2":"Los","g.quick":"Schnellauswahl","g.bad":"Ungültiger t auf die Position vom 5. Nov. 2026. <b>Nach 2026:<\/b> Trägheitsbewegung plus Korrektur durch die Sonne, auf lange Sicht die Anziehung der Galaxis über die epizyklischen Hill-Gleichungen mit den Oortschen Konstanten A=15,3 und B=−11,9 km/s/kpc und einer vertikalen Frequenz von ≈0,08 rad/Mio. Jahre. <b>Sterne:<\/b> J2000-Positionen, Parallaxe, Eigenbewegung und ungefähre Radialgeschwindigkeit, mit derselben Dynamik fortgeschrieben.","ab.h3":"Grenzen","ab.p3":"Die Positionen für 2026 (Entfernung, Richtung) sind Näherungen; im Lichtjahr-Maßstab weichen sie von den JPL-Ephemeriden ab. Keine Anziehung durch andere Körper und keine Bahnkorrekturen; Planetenvorbeiflüge werden als Punkte behandelt (Patched Conics). Das Galaxienmodell ist eine Linearisierung um die Sonnenbahn: genau über zehn Millionen Jahre, ab Hunderten Millionen Jahren nur noch ein Richtwert, wenn die Sonden Kiloparsec von der Sonne entfernt sind. Die Daten zum Ende der Übertragung sind Schätzungen, keine offiziellen Prognosen.","ab.h4":"Aktuelles Datum","ab.p4":"Beim Start synchronisiert sich die App mit der Geräteuhr (Modus „Echtzeit“): relative Angaben („vor“, „in“) und die Markierung „heute“ auf der Bahn beziehen sich auf den heutigen Tag. Die Sondenposition wird von der zuletzt kalibrierten Position (5. Nov. 2026) aus extrapoliert, gültig für jedes spätere Datum; die Schaltfläche „Jetzt“ kehrt jederzeit zur Echtzeit zurück.","ab.h5":"Ein bestimmter Zeitpunkt","ab.p5":"Die Schaltfläche „📅 Datum“ öffnet ein Fenster, in dem du ein genaues Kalenderdatum (Uhrzeit in UTC, von den Starts bis +1 Milliarde Jahre), ein Intervall relativ zu heute („in 250 Jahren“, „vor 10 Jahren“) oder einen Schnellmoment wählen kannst. Nach der Auswahl läuft „Abspielen“ von dort weiter, mit 1 Jahr pro Sekunde. Die Seitenadresse erhält eine Markierung <b>#t=<\/b>, die du speichern oder weitergeben kannst.","ab.h6":"Steuerung","ab.p6":"Ziehen auf dem Bildschirm dreht die Ansicht, Mausrad / Pinch zoomt (das schaltet den Auto-Zoom aus), Doppelklick setzt den Winkel zurück. Leertaste = Abspielen / Pause. Das „mitrotierende“ System zeigt die Bahn in dem System, das sich mit der Galaxis dreht.","ab.h7":"Die Goldene Schallplatte","ab.p7":"Jede Sonde trägt eine vergoldete Kupferscheibe mit Klängen und Bildern der Erde, als Botschaft für eine mögliche Entdeckung in ferner Zukunft.","ab.src":"Quelle der Missionsdaten: NASA/JPL. Eine App in einer einzigen Datei, die ohne Internet funktioniert."},"hu":{"title":"VOIAJOR — a Voyager–1 és –2 a kilövéstől a távoli jövőig","desc":"A Voyager–1 és a Voyager–2 pályájának részletes szimulációja 1977-től több mint egymilliárd évvel előre, tetszőleges léptékben.","brand":"Voyager 1 · Voyager 2 — a kilövéstől a távoli jövőig","b.data":"Adatok","b.opt":"Beállítások","tab.tel":"Telemetria","tab.ev":"Események","tab.stars":"Csillagok","tab.about":"Névjegy","tel.note":"Az értékek a szimulált pillanatra vonatkoznak. 2026 után minden extrapoláció.","ev.all":"Mindkettő","ev.both":"Mindkét szonda","st.h1":"Legkisebb távolságú csillagközeli elhaladások (modell, 2026-tól)","st.calc":"Számítás…","st.h2":"A Naphoz legközelebbi csillagok a szimulált pillanatban","o.h1":"Megjelenítés","o.orb":"Bolygópályák","o.lab":"Feliratok","o.hel":"Helioszféra (lökéshullám-határ, heliopauza)","o.oort":"Oort-felhő","o.star":"Közeli csillagok","o.ring":"Távolságkörök (fénynap, fényév)","o.fut":"Jövőbeli pálya (pontozott)","o.gal":"Galaxis (nagy léptékben)","o.auto":"Automatikus nagyítás (követi a szondákat)","o.cor":"A Galaxissal együtt forgó vonatkoztatási rendszer","o.h2":"Nézet középpontja","o.sun":"A Nap","o.mid":"A két szonda felezőpontja","o.reset":"Nézőszög visszaállítása","o.lang":"Nyelv","g.title":"Ugrás egy adott pillanatra","g.close":"Bezárás","g.date":"Naptári dátum (idő UTC szerint)","g.day":"Nap","g.month":"Hónap","g.year":"Év","g.hour":"Idő","g.go":"Ugrás a dátumra","g.rel":"A mai naphoz képest","g.after":"múlva","g.before":"ezelőtt","g.ud":"nap","g.umo":"hónap","g.uy":"év", . 5-i pozíciót. <b>2026 után:<\/b> tehetetlenségi mozgás a Nap korrekciójával, hosszú távon pedig a Galaxis vonzása az epiciklikus (Hill-féle) egyenleteken keresztül, A=15,3 és B=−11,9 km/s/kpc Oort-állandókkal és ≈0,08 rad/millió év függőleges frekvenciával. <b>Csillagok:<\/b> J2000 pozíciók, parallaxis, sajátmozgás és hozzávetőleges radiális sebesség, ugyanazzal a dinamikával továbbvezetve.","ab.h3":"Korlátok","ab.p3":"A 2026-os pozíciók (távolság, irány) közelítések; fényévnyi léptékben eltérnek a JPL efemeridáitól. Nincs más égitestek vonzása és pályakorrekció; a bolygók melletti elhaladásokat pontszerűnek tekintjük (összeillesztett kúpszeletek). A galaktikus modell a Nap pályája körüli linearizálás: több tízmillió évre pontos, több száz millió évtől már csak tájékoztató jellegű, amikor a szondák kiloparszekekre vannak a Naptól. Az adás megszűnésére vonatkozó időpontok becslések, nem hivatalos előrejelzések.","ab.h4":"Aktuális dátum","ab.p4":"Indításkor az alkalmazás szinkronizálja magát az eszköz órájával („Valós idő” mód): a relatív dátumok („ezelőtt”, „múlva”) és a pályán látható „ma” jelölés a mai napra vonatkoznak. A szondák helyzetét az utolsó kalibrált pozícióból (2026. nov. 5.) extrapoláljuk, bármely későbbi dátumra érvényesen; a „Most” gomb bármikor visszatér a valós időhöz.","ab.h5":"Egy adott pillanat","ab.p5":"A „📅 Dátum” gomb egy ablakot nyit, ahol pontos naptári dátumot (UTC szerinti idővel, a kilövésektől +1 milliárd évig), a mai naphoz viszonyított időközt („250 év múlva”, „10 évvel ezelőtt”) vagy egy gyors pillanatot választhatsz. A választás után a „Lejátszás” onnan folytatódik, másodpercenként 1 évvel. Az oldal címe egy <b>#t=<\/b> jelölést kap, amelyet elmenthetsz vagy elküldhetsz.","ab.h6":"Vezérlők","ab.p6":"Húzással forgathatsz, görgővel / csippentéssel nagyíthatsz (ez kikapcsolja az automatikus nagyítást), dupla kattintással visszaállíthatod a szöget. Szóköz = lejátszás / szünet. Az „együtt forgó” rendszer a pályát a Galaxissal együtt forgó vonatkoztatási rendszerben mutatja.","ab.h7":"Az Aranylemez","ab.p7":"Mindkét szonda egy aranyozott rézlemezt hordoz a Föld hangjaival és képeivel, üzenetként egy esetleges felfedezés számára a nagyon távoli jövőben.","ab.src":"A küldetési adatok forrása: NASA/JPL. Egyetlen fájlból álló alkalmazás, internet nélkül is működik."}};/*I18N-END*/</script>

  if(tau<V.ts)return r<30?tr('reg.sat'):r<50?tr('reg.nep'):tr('reg.helio');if(tau<V.hp)return tr('reg.sheath');
  if(r<1000)return tr('reg.ism0');if(r<2e4)return tr('reg.oi');if(r<1e5)return tr('reg.oo');
  if(r<3e6)return tr('reg.ism1');if(r<2e7)return tr('reg.lb');if(r<2e8)return tr('reg.orion');
  if(r<3e9)return tr('reg.disk');return tr('reg.gal');}
function status(V,tau){if(tau<V.launch)return tr('sta.pre');if(tau<TAU0)return tr('sta.act');if(tau<M.T(2033,1,1))return tr('sta.red');return tr('sta.dead');}
const dl=(k,v)=>'<dt>'+k+'</dt><dd>'+v+'</dd>';
function updTel(){
  if(!S.side)return;
  [[V1,P.v1,'d1'],[V2,P.v2,'d2']].forEach(a=>{const V=a[0],p=a[1],r=M.norm(p),sp=S.tau<V.launch?0:M.voySpeed(V,S.tau),rd=raDec(p),earth=M.norm(M.sub(p,M.planetPos(2,S.tau)));
    let near='',nd=1e30;STARS.forEach(s=>{const d=M.norm(M.sub(p,M.starPos(s,S.tau,!!S.opts.cor)));if(d<nd){nd=d;near=starName(s);}});
    $(a[2]).innerHTML=dl(tr('tl.status'),status(V,S.tau))+dl(tr('tl.region'),region(V,r,S.tau))+dl(tr('tl.sun'),fmtDist(r)+(r>1e4?'':' = '+nf(r*AU_KM/1e9,2)+' '+tr('u.bn')+' '+tr('u.km')))+
      dl(tr('tl.earth'),S.tau<V.launch?'—':fmtDist(earth))+dl(tr('tl.sig'),S.tau<V.launch?'—':fmtLT(earth))+dl(tr('tl.speed'),S.tau<V.launch?'—':nf(sp,2)+' km/s')+
      dl(tr('tl.dir'),fmtHM(rd.ra)+' / '+nf(rd.dec,1)+'°')+dl(tr('tl.since'),S.tau<V.launch?'—':fmtYears(S.tau-V.launch))+dl(tr('tl.star'),near+' · '+fmtDist(nd));});
  const near=STARS.map(s=>({n:starName(s),d:M.norm(M.starPos(s,S.tau,!!S.opts.cor))})).sort((a,b)=>a.d-b.d).slice(0,8);
  $('nearNow').innerHTML='<table>'+near.map(x=>'<tr><td>'+x.n+'</td><td class="r">'+fmtDist(x.d)+'</td></tr>').join('')+'</table>';}

// ---------- evenimente (listă) ----------
let evF=0;
function renderEv(){const L=$('evList');L.innerHTML='';EV.filter(e=>evF===0||e.v===evF||e.v===0).forEach(e=>{const d=document.createElement('div');d.className='ev';
  const cols=e.v===0?'linear-gradient(90deg,var(--v1),var(--v2))':(e.v===1?'var(--v1)':'var(--v2)');
  const txt=rs(e.txt,e);
  d.innerHTML='<div class="d"><span class="dot" style="background:'+cols+'"></span>'+(e.v?VOY[e.v-1].name:tr('ev.both'))+' · '+fmtDate(e.t)+' · '+relNow(e.t)+'</div><div class="t">'+rs(e.title,e)+'</div><div class="x">'+txt+'</div>';
  d.onclick=()=>{S.tau=e.t;setPlay(false);leaveLive();clearHash();syncUI();if(sheet){S.side=false;applySide();}};L.appendChild(d);});}

// ---------- apropieri de stele ----------
let APPR=null;
async function computeApproaches(){
  const out=[];for(const V of VOY){const rows=[];for(const s of STARS){const c=M.closest(V,s,2.5e6);rows.push({s,t:c.t,d:c.d});await new Promise(r=>setTimeout(r,0));}rows.sort((a,b)=>a.d-b.d);out.push(rows.slice(0,5));}
  out.forEach((arr,i)=>{arr.slice(0,2).forEach(x=>{if(x.d/LY_AU<6)ev(VOY[i].id,x.t,()=>tr('ap.l',starName(x.s)),()=>tr('ap.t',starName(x.s)),()=>tr('ap.x',nf(x.d/LY_AU,2)),'star');});});
  const LIT=[[V1,'Gliese 445',1.6,40000],[V2,'Ross 248',1.7,42000],[V2,'Sirius',4.3,296000]];
  APPR={out,lit:LIT.map(x=>{const s=STARS.find(q=>q.name===x[1]);return {V:x[0],s,ly:x[2],yr:x[3],c:M.closest(x[0],s,1.2e6)};})};
  EV.sort((a,b)=>a.t-b.t);evPos();renderEv();renderAppr();}
function renderAppr(){if(!APPR)return;let html='';
  APPR.out.forEach((arr,i)=>{html+='<div class="card"><h3 style="color:'+VOY[i].col+'">'+VOY[i].name+'</h3><table><tr><th>'+tr('ap.star')+'</th><th>'+tr('ap.when')+'</th><th class="r">'+tr('ap.dist')+'</th></tr>'+
    arr.map(x=>'<tr><td><a href="#" data-t="'+x.t+'" style="color:#cfe0ff">'+starName(x.s)+'</a></td><td>'+fmtDate(x.t)+'</td><td class="r">'+lyS(x.d/LY_AU,2)+'</td></tr>').join('')+'</table></div>';});
  html+='<h4>'+tr('ap.lit')+'</h4><table><tr><th>'+tr('ap.pair')+'</th><th class="r">'+tr('ap.litc')+'</th><th class="r">'+tr('ap.modc')+'</th></tr>'+APPR.lit.map(x=>{const c=x.c,dy=Math.round((c.t-TAU0)/100)*100;
    return '<tr><td>'+x.V.name.replace('Voyager ','V')+' · '+starName(x.s)+'</td><td class="r">≈'+lyS(x.ly,1)+' · ~'+nf(x.yr,0)+' '+pl(x.yr,'u.year')+'</td><td class="r">'+lyS(c.d/LY_AU,1)+' · +'+nf(dy,0)+' '+pl(dy,'u.year')+'</td></tr>';}).join('')+'</table><div class="small">'+tr('ap.note')+'</div>';
  $('appr').innerHTML=html;$('appr').querySelectorAll('a').forEach(a=>a.onclick=ev=>{ev.preventDefault();S.tau=parseFloat(a.dataset.t);setPlay(false);leaveLive();clearHash();syncUI();});}

// ---------- „Despre” ----------
function renderAbout(){let h='';for(let i=1;i<=7;i++)h+='<h4>'+tr('ab.h'+i)+'</h4><p>'+tr('ab.p'+i)+'</p>';$('p-about').innerHTML=h+'<p class="small">'+tr('ab.src')+'</p>';}

// ---------- UI ----------
function applySide(){$('side').classList.toggle('hide',!S.side);$('bSide').classList.toggle('on',S.side);layout();if(S.side)updTel();}
function leaveLive(){if(S.mode==='live'){S.mode='rate';S.rate=1;selRate.value=5;}}
function syncUI(){$('tSl').value=pOfTau(S.tau);$('zSl').value=S.logW;}
function setPlay(b){S.play=b;$('bPlay').innerHTML=(b?'⏸':'▶')+'<span class="lbl"> '+tr(b?'ctl.pause':'ctl.play')+'</span>';$('bPlay').classList.toggle('on',b);}
$('bPlay').onclick=()=>{if(!S.play&&S.tau>=TMAX-1)S.tau=TMIN;clearHash();setPlay(!S.play);};
$('bStart').onclick=()=>{S.tau=TMIN;setPlay(false);leaveLive();clearHash();syncUI();};
$('bNow').onclick=()=>{selRate.value=0;S.mode='live';S.tau=clampT(nowTau());setPlay(true);syncUI();clearHash();};
selRate.onchange=()=>{clearHash();const r=RATES[selRate.value];S.mode=(r[1]==='cine'||r[1]==='live')?r[1]:'rate';S.rate=r[2];if(S.mode==='live')setPlay(true);};
$('tSl').oninput=e=>{clearHash();{const wasLive=S.mode==='live';leaveLive();if(wasLive)setPlay(false);}S.tau=tauOfP(parseFloat(e.target.value));};
$('zSl').oninput=e=>{S.logW=parseFloat(e.target.value);setAuto(false);};
selZ.onchange=()=>{if(selZ.value===''){return;}const z=ZP[selZ.value];S.logW=Math.log10(z[1]);setAuto(false);selZ.value='';syncUI();};
function setAuto(b){S.opts.auto=b?1:0;$('oAuto').checked=!!b;}
$('bSide').onclick=()=>{S.side=!S.side;applySide();};
$('bMore').onclick=()=>{minUser=!$('ctl').classList.contains('min');modeClasses();measure();layout();};
$('bOpt').onclick=()=>{$('opt').classList.toggle('on');$('bOpt').classList.toggle('on');};
const optMap={oOrb:'orb',oLab:'lab',oHel:'hel',oOort:'oort',oStar:'star',oRing:'ring',oFut:'fut',oGal:'gal',oAuto:'auto',oCor:'cor'};
Object.keys(optMap).forEach(id=>{$(id).onchange=e=>{S.opts[optMap[id]]=e.target.checked?1:0;if(id==='oCor'){buildPaths();evPos();}};});
$('selFocus').onchange=e=>{S.focus=e.target.value;};
$('bReset').onclick=()=>{S.yaw=-0.5;S.pitch=0.55;};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='p-'+b.dataset.t));});
document.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{evF=parseInt(b.dataset.f);document.querySelectorAll('.chips button').forEach(x=>x.classList.toggle('on',x===b));renderEv();});
addEventListener('keydown',e=>{if(e.code==='Space'&&!gEl.classList.contains('on')&&!/INPUT|SELECT|BUTTON/.test(document.activeElement.tagName)){e.preventDefault();$('bPlay').click();}});
// gesturi
const ptrs=new Map();let pinch0=0,zoom0=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);if(ptrs.size===2){const a=[...ptrs.values()];pinch0=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);zoom0=S.logW;}});
cv.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;
  if(ptrs.size===1){S.yaw-=(e.clientX-p[0])*0.006;S.pitch=Math.max(-1.55,Math.min(1.55,S.pitch+(e.clientY-p[1])*0.006));p[0]=e.clientX;p[1]=e.clientY;}
  else{p[0]=e.clientX;p[1]=e.clientY;const a=[...ptrs.values()],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(pinch0>0){S.logW=Math.max(-1.3,Math.min(10.5,zoom0-Math.log10(d/pinch0)));setAuto(false);}}});
const up=e=>{ptrs.delete(e.pointerId);pinch0=0;};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();S.logW=Math.max(-1.3,Math.min(10.5,S.logW+(e.deltaMode===1?e.deltaY*33:e.deltaMode===2?e.deltaY*400:e.deltaY)*0.0012));setAuto(false);},{passive:false});
cv.addEventListener('dblclick',()=>{S.yaw=-0.5;S.pitch=0.55;});
addEventListener('resize',resize);

// ---------- mergi la un moment ----------
const gEl=$('goto'),gMo=$('gM');
function fillMonths(){const v=gMo.value||'1';gMo.innerHTML='';MOL.forEach((m,i)=>{const o=document.createElement('option');o.value=i+1;o.textContent=m;gMo.appendChild(o);});gMo.value=v;}
const pad2=n=>(n<10?'0':'')+n;
function partsToTau(y,mo,d,H,Mi){
  if(d<1||d>31)return null;if(y<1977)return -1e3;
  if(y<=9999){const J=M.jd(y,mo,d,H+Mi/60),c=M.calFromJD(J);if(Math.floor(c.d)!==d||c.m!==mo)return null;return (J-2451545)/365.25;}
  const dim=[31,(y%4===0&&(y%100!==0||y%400===0))?29:28,31,30,31,30,31,31,30,31,30,31][mo-1];if(d>dim)return null;
  return (y-2000)+(mo-1)/12+(d-1)/365.25+(H+Mi/60)/8766;}
function setHash(t){try{let s;if(t<=1000){const c=M.calFromJD(2451545+t*365.25);s=c.y+'-'+pad2(c.m)+'-'+pad2(Math.floor(c.d));}else s='y'+Math.round(2000+t);history.replaceState(null,'','#t='+s);}catch(e){}}
function clearHash(){try{if(location.hash)history.replaceState(null,'',location.pathname+location.search);}catch(e){}}
function parseHash(){try{const m=/^#t=(\d{4})-(\d{2})-(\d{2})$/.exec(location.hash);if(m){const J=M.jd(+m[1],+m[2],+m[3],12),c=M.calFromJD(J);if(+m[1]<1583||c.y!==+m[1]||c.m!==+m[2]||Math.floor(c.d)!==+m[3])return null;return (J-2451545)/365.25;}
  const k=/^#t=y(\d{1,10})$/.exec(location.hash);if(k)return +k[1]-2000;}catch(e){}return null;}
function gMsg(t,bad){const e=$('gMsg');e.textContent=t||'';e.style.color=bad?'#ff9d8a':'';}
function openGo(){const t=S.tau;let y,mo=1,d=1,H=12,Mi=0;
  if(t<=1000){const c=M.calFromJD(2451545+t*365.25);y=c.y;mo=c.m;d=Math.floor(c.d);H=Math.floor(c.h);Mi=Math.floor((c.h-H)*60);}else y=Math.round(2000+t);
  $('gD').value=d;gMo.value=mo;$('gY').value=y;$('gH').value=pad2(H)+':'+pad2(Mi);gMsg('');gEl.classList.add('on');gGo_prev=document.activeElement;
  if(!matchMedia('(pointer:coarse)').matches)$('gY').focus();}
function closeGo(){if(!gEl.classList.contains('on'))return;gEl.classList.remove('on');try{(gGo_prev||$('bGo')).focus();}catch(e){}}
function goTo(tau){gMsg('');if(!isFinite(tau)){gMsg(tr('g.bad'),1);return;}let t=tau,note='';
  if(t<TMIN){t=TMIN;note=tr('g.pre');}else if(t>TMAX){if(t-TMAX>1e6)note=tr('g.max');t=TMAX;}
  setPlay(false);leaveLive();
  S.tau=t;syncUI();setHash(t);if(note)gMsg(note);else closeGo();}
function goDate(){const d=parseInt($('gD').value),mo=parseInt(gMo.value),y=Math.round(Number($('gY').value)),hm=($('gH').value||'12:00').split(':'),H=+hm[0]||0,Mi=+hm[1]||0;
  if(!isFinite(d)||!isFinite(y)||y<1){gMsg(tr('g.fill'),1);return;}
  const t=partsToTau(y,mo,d,H,Mi);if(t===null){gMsg(tr('g.nodate'),1);return;}goTo(t);}
function goRel(){const n=parseFloat($('gN').value);if(!isFinite(n)||n<0){gMsg(tr('g.pos'),1);return;}goTo(nowTau()+parseInt($('gS').value)*n*parseFloat($('gU').value));}

$('gMsg').setAttribute('role','status');
let gGo_prev=null;
$('bGo').onclick=openGo;$('gX').onclick=closeGo;gEl.addEventListener('click',e=>{if(e.target===gEl)closeGo();});
$('gGo').onclick=goDate;$('gGo2').onclick=goRel;
['gD','gY','gH'].forEach(i=>$(i).addEventListener('keydown',e=>{if(e.key==='Enter')goDate();}));$('gN').addEventListener('keydown',e=>{if(e.key==='Enter')goRel();});
addEventListener('keydown',e=>{if(e.key==='Escape')closeGo();
  if(e.key==='Tab'&&gEl.classList.contains('on')){const f=[...gEl.querySelectorAll('button,input,select')].filter(x=>x.offsetParent!==null);if(!f.length)return;const a=f[0],z=f[f.length-1];
    if(!gEl.contains(document.activeElement)){e.preventDefault();a.focus();}else if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}}});
const GCH=[['c.l2',()=>V2.launch],['c.l1',()=>V1.launch],['c.jup',()=>M.T(1979,3,5,12.1)],['c.pbd',()=>M.T(1990,2,14)],['c.hp1',()=>V1.hp],['c.hp2',()=>V2.hp],['c.today',()=>nowTau()],['c.p100',()=>nowTau()+100],['c.y5k',()=>3000],['c.y40k',()=>38000],['c.p1m',()=>nowTau()+1e6],['c.p1b',()=>TMAX]];
function fillChips(){const box=$('gChips');box.innerHTML='';GCH.forEach(c=>{const b=document.createElement('button');b.textContent=tr(c[0]);b.onclick=()=>goTo(c[1]());box.appendChild(b);});}
const RM=(()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){return false;}})();
// ---------- bucla principală ----------
let last=performance.now(),telT=0,uiT=0;
function frame(ts){try{frameBody(ts);}catch(err){if(!frame.e){frame.e=1;console.error(err);}}requestAnimationFrame(frame);}
function frameBody(ts){const dt=Math.min(0.1,(ts-last)/1000);last=ts;
  if(S.play){if(S.mode==='live'){S.tau=clampT(nowTau());}else if(S.mode==='cine'){let p=pOfTau(S.tau)+7*dt;if(p>=1000){p=1000;setPlay(false);}S.tau=tauOfP(p);}
    else{S.tau+=S.rate*dt;if(S.tau>=TMAX){S.tau=TMAX;setPlay(false);}}}
  const cor=!!S.opts.cor;P.v1=M.voyPos(V1,S.tau,cor);P.v2=M.voyPos(V2,S.tau,cor);{const nt=nowTau();P.showNow=Math.abs(S.tau-nt)>0.003;if(P.showNow){P.n1=M.voyPos(V1,nt,cor);P.n2=M.voyPos(V2,nt,cor);}}P.planets=[];for(let i=0;i<8;i++)P.planets.push(M.planetPos(i,S.tau));
  F=S.focus==='v1'?P.v1:S.focus==='v2'?P.v2:S.focus==='mid'?[(P.v1[0]+P.v2[0])/2,(P.v1[1]+P.v2[1])/2,(P.v1[2]+P.v2[2])/2]:[0,0,0];
  if(S.opts.auto){const d=a=>M.norm(M.sub(a,F));let R=Math.max(d(P.v1),d(P.v2),d([0,0,0]));R=Math.max(R,1.8);const tgt=Math.log10(R*(compact?1.2:1.45));S.logW+=(tgt-S.logW)*(RM?1:1-Math.exp(-dt*4));}
  layout();setView();draw();
  setT('dateBig',S.play&&S.mode==='live'?fmtDateTime(S.tau):fmtDate(S.tau));setT('dateSub',fmtDateSub(S.tau));
  setT('tLabel',S.mode==='cine'?tr('ctl.cine'):S.mode==='live'&&S.play?tr('ctl.live'):'');
  uiT+=dt;if(uiT>0.1){uiT=0;if(document.activeElement!==$('tSl'))$('tSl').value=pOfTau(S.tau);if(document.activeElement!==$('zSl'))$('zSl').value=S.logW;}
  telT+=dt;if(telT>0.2){telT=0;updTel();}}
// ---------- aplicarea limbii ----------
function applyLang(l){
  if(!I18N[l])l='en';LANG=l;LOC=LANGS.find(x=>x[0]===l)[3];MOS=trList('mo.s');MOL=trList('mo.l');
  document.documentElement.lang=l;document.title=tr('title');
  const md=document.querySelector('meta[name=description]');if(md)md.setAttribute('content',tr('desc'));
  document.querySelectorAll('[data-i]').forEach(e=>{e.innerHTML=tr(e.dataset.i);});
  document.querySelectorAll('[data-ia]').forEach(e=>e.dataset.ia.split(';').forEach(q=>{const i=q.indexOf(':');e.setAttribute(q.slice(0,i),tr(q.slice(i+1)));}));
  fillRates();fillZ();buildTicks();buildRings();fillMonths();fillChips();renderAbout();setPlay(S.play);gMsg('');
  [...$('lang').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===l?'true':'false'));
  try{localStorage.setItem('voiajor.lang',l);}catch(e){}
  ['dateBig','dateSub','tLabel','scaleTxt'].forEach(i=>{$(i)._t=null;});
  renderEv();renderAppr();updTel();measure();lastKey='';layout();}
(function(){const bar=$('lang');
  LANGS.forEach(x=>{const b=document.createElement('button');b.type='button';b.textContent=x[1];b.dataset.l=x[0];b.lang=x[0];b.title=x[2];b.setAttribute('aria-label',x[2]);b.onclick=()=>applyLang(x[0]);bar.appendChild(b);});
  let l=null;
  try{const q=new URLSearchParams(location.search).get('lang');if(q&&I18N[q])l=q;}catch(e){}
  try{if(!l){const v=localStorage.getItem('voiajor.lang');if(v&&I18N[v])l=v;}}catch(e){}
  if(!l){for(const n of (navigator.languages||[navigator.language||'en'])){const c=String(n).slice(0,2).toLowerCase();if(I18N[c]){l=c;break;}}}
  applyLang(l||'en');})();

modeClasses();S.side=!compact&&!sheet;
resize();applySide();S.mode='live';S.tau=clampT(nowTau());const hp=parseHash();if(hp!==null){S.tau=clampT(hp);S.mode='rate';S.rate=1;selRate.value=5;}
renderEv();syncUI();updTel();setPlay(hp===null);
$('tLabel').textContent='';
requestAnimationFrame(frame);
setTimeout(computeApproaches,400);
})();
</script>
