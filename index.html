<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Simulare detaliată a traseului sondelor Voyager 1 și 2, din 1977 până peste un miliard de ani, la orice scară.">
<title>VOIAJOR — Voyager 1 și 2, de la lansare în viitorul îndepărtat</title>
<style>
:root{--bg:#04060c;--panel:rgba(9,13,23,.93);--line:rgba(140,170,220,.22);--tx:#dbe6f6;--mut:#8ea0bd;--v1:#ffb347;--v2:#4fc3f7;--acc:#9ad0ff;--ok:#7be0a4;--toph:48px;--ctlh:150px;--sidew:360px;--sheeth:45vh}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body.compact{font-size:13px}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#cv:active{cursor:grabbing}
button,select,input{font:inherit;color:inherit}
button,select{background:rgba(30,42,66,.88);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;min-height:32px}
button:hover{background:rgba(52,72,110,.9)}
button.on{background:#27508a;border-color:#6fb0ff}
body.compact button,body.compact select{padding:4px 9px;min-height:30px;font-size:13px}
@media (pointer:coarse){button,select{min-height:36px}body.compact button,body.compact select{min-height:34px}}
#top{position:fixed;left:0;right:0;top:0;height:var(--toph);display:flex;justify-content:space-between;align-items:center;padding:0 max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));gap:8px;pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
.brand{display:flex;flex-direction:column;line-height:1.15;text-shadow:0 1px 6px #000}
.brand b{letter-spacing:.25em;font-size:16px}
.brand span{color:var(--mut);font-size:11px}
body.compact .brand b{font-size:13px;letter-spacing:.2em}
body.compact .brand span{display:none}
.tb{display:flex;gap:6px}
#hud{position:fixed;left:max(12px,env(safe-area-inset-left));top:calc(var(--toph) + 4px);z-index:4;pointer-events:none;text-shadow:0 1px 5px #000,0 0 3px #000;max-width:min(70vw,520px)}
#dateBig{font-size:20px;font-weight:600;letter-spacing:.02em;line-height:1.2}
#dateSub{color:var(--mut);font-size:12px}
#scaleTxt{margin-top:6px;color:var(--acc);font-size:12px}
#bar{margin-top:3px;height:6px;border:2px solid var(--acc);border-top:none;width:110px}
body.compact #dateBig{font-size:15px}
body.compact #dateSub{font-size:10.5px;line-height:1.25}
body.compact #scaleTxt{margin-top:3px;font-size:10.5px}
body.compact #bar{height:5px;border-width:1.5px}
#side{position:fixed;right:0;top:var(--toph);bottom:var(--ctlh);width:var(--sidew);max-width:100%;background:var(--panel);border-left:1px solid var(--line);border-top:1px solid var(--line);z-index:6;display:flex;flex-direction:column;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding-right:env(safe-area-inset-right)}
#side.hide{display:none}
body.sheet #side{left:0;right:0;top:auto;width:100%;height:var(--sheeth);border-left:none;border-radius:14px 14px 0 0;padding-right:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:none;border-radius:0;background:transparent;padding:8px 2px;font-size:13px;color:var(--mut)}
body.compact .tabs button{font-size:12px;padding:6px 1px}
body.sheet .tabs button:first-child{border-top-left-radius:14px}
body.sheet .tabs button:last-child{border-top-right-radius:14px}
.tabs button.on{color:#fff;background:rgba(60,100,170,.35);box-shadow:inset 0 -2px 0 var(--acc)}
.pane{display:none;overflow:auto;padding:10px 12px;flex:1;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pane.on{display:block}
body.compact .pane{padding:7px 10px}
.card{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:10px;background:rgba(18,26,44,.55)}
.card h3{margin:0 0 4px;font-size:15px}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px}
dt{color:var(--mut)}
dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
body.compact .card{padding:6px 8px;margin-bottom:7px}
body.compact .card h3{font-size:13px;margin-bottom:2px}
body.compact dl{font-size:12px;gap:1px 8px}
/* sheet: cele două sonde unul lângă altul când e loc */
body.sheet #p-tel{display:none}
body.sheet #p-tel.on{display:grid;grid-template-columns:1fr;gap:0}
@media (min-width:600px){body.sheet #p-tel.on{grid-template-columns:1fr 1fr;gap:0 8px;align-content:start}body.sheet #p-tel .small{grid-column:1/3}}
.ev{padding:7px 8px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
.ev:hover{background:rgba(70,110,180,.2)}
.ev .d{font-size:12px;color:var(--mut)}
.ev .t{font-weight:600}
.ev .x{font-size:12px;color:#b9c8e0}
body.compact .ev{padding:5px 6px}
body.compact .ev .d,body.compact .ev .x{font-size:11px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.chips{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td,th{padding:3px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mut);font-weight:500}
td.r{text-align:right;font-variant-numeric:tabular-nums}
body.compact table{font-size:12px}
.small{font-size:12px;color:var(--mut)}
.pane h4{margin:12px 0 4px;font-size:13px;color:var(--acc)}
.pane p{margin:4px 0 8px;font-size:13px}
body.compact .pane p{font-size:12.5px}
#ctl{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));z-index:7;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
body.compact #ctl{padding-top:5px;padding-bottom:calc(5px + env(safe-area-inset-bottom))}
.row{display:flex;gap:6px;align-items:center;flex-wrap:nowrap}
.row+.row{margin-top:4px}
#tLabel{margin-left:auto;color:var(--acc);font-size:12px;white-space:nowrap}
#bMore{display:none;margin-left:auto}
body.compact #bMore{display:inline-block}
body.compact #tLabel{display:none}
body.compact .lbl{display:none}
#selRate{min-width:0;flex:0 1 190px;text-overflow:ellipsis}
body.compact #selRate{flex:1 1 auto;max-width:210px}
.sl{position:relative;margin-top:2px}
input[type=range]{width:100%;accent-color:#6fb0ff;margin:4px 0;height:24px}
#ticks{position:relative;height:14px;font-size:10px;color:var(--mut)}
#ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
#ticks span:first-child,#ticks span.l{transform:none}
#ticks span:last-child{transform:translateX(-100%)}
body.compact #ticks{height:13px;font-size:10px}
body.compact #ticks span:not(.k){display:none}
.zrow input[type=range]{flex:1;min-width:80px}
#selZ{flex:0 1 190px;min-width:0}
body.compact #selZ{flex:0 0 118px}
#ctl.min .zrow,#ctl.min #ticks{display:none}
#opt{position:fixed;right:max(10px,env(safe-area-inset-right));bottom:calc(var(--ctlh) + 8px);max-height:calc(100vh - var(--toph) - var(--ctlh) - 16px);max-height:calc(100dvh - var(--toph) - var(--ctlh) - 16px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;z-index:9;display:none;min-width:240px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#opt.on{display:block}
#opt>b{display:block;margin-top:8px}
#opt>b:first-child{margin-top:0}
#lang{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 2px}
#lang button{padding:3px 8px;min-height:30px;min-width:40px;font-size:12px}
#lang button[aria-pressed=true]{background:#27508a;border-color:#6fb0ff;font-weight:600}
@media (pointer:coarse){#lang button{min-height:40px;min-width:44px}}
#opt label{display:flex;gap:8px;align-items:center;padding:3px 0;cursor:pointer}
#opt select{width:100%;margin:4px 0 8px}
body.compact #opt{left:max(10px,env(safe-area-inset-left));min-width:0;padding:8px 10px;font-size:13px}
@media (min-width:480px){body.compact #opt{left:auto;min-width:260px}}
@media (hover:none){body.compact #opt label{padding:5px 0}}

#goto{position:fixed;inset:0;background:rgba(2,4,10,.62);z-index:20;display:none;align-items:center;justify-content:center;padding:12px;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
#goto.on{display:flex}
.gbox{width:100%;max-width:440px;max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);overflow:auto;background:#0b111e;border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.ghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ghead b{font-size:15px}
.gsec{border-top:1px solid var(--line);padding:8px 0 6px}
.glab{color:var(--acc);font-size:12px;margin-bottom:6px}
.ggrid{display:grid;grid-template-columns:.8fr 1.5fr 1.1fr 1fr;gap:8px}
.ggrid2{display:grid;grid-template-columns:1fr 1fr 1.6fr;gap:8px}
.gbox label{display:block;color:var(--mut);font-size:11px}
.gbox input,.gbox select{width:100%;margin-top:2px;background:rgba(30,42,66,.88);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:34px;color:var(--tx)}
.ggrid2 input,.ggrid2 select{margin-top:0}
.gbox button.pri{width:100%;margin-top:8px;background:#27508a;border-color:#6fb0ff}
#gMsg{min-height:16px;margin-top:4px}
#gChips button{font-size:12px;padding:3px 8px;min-height:28px}
body.compact .ggrid{grid-template-columns:1fr 1.6fr}
body.compact .ggrid2{grid-template-columns:1fr 1fr}
body.compact .ggrid2 select:last-child{grid-column:1/3}
body.compact #bPlay,body.compact #bStart,body.compact #bMore,body.compact #bGo{min-width:40px}
dl{grid-template-columns:minmax(0,max-content) minmax(0,1fr)}
@media (pointer:coarse){#gChips button{min-height:34px}body.compact .row button,body.compact .row select,body.compact #top button{min-height:40px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="top">
  <div class="brand"><b>VOIAJOR</b><span data-i="brand"></span></div>
  <div class="tb"><button id="bSide" class="on" data-i="b.data"></button><button id="bOpt" data-i="b.opt"></button></div>
</div>

<div id="hud">
  <div id="dateBig"></div>
  <div id="dateSub"></div>
  <div id="scaleTxt"></div>
  <div id="bar"></div>
</div>

<aside id="side">
  <div class="tabs">
    <button data-t="tel" class="on" data-i="tab.tel"></button>
    <button data-t="evs" data-i="tab.ev"></button>
    <button data-t="stars" data-i="tab.stars"></button>
    <button data-t="about" data-i="tab.about"></button>
  </div>
  <div class="pane on" id="p-tel">
    <div class="card" id="c1"><h3><span class="dot" style="background:var(--v1)"></span>Voyager 1</h3><dl id="d1"></dl></div>
    <div class="card" id="c2"><h3><span class="dot" style="background:var(--v2)"></span>Voyager 2</h3><dl id="d2"></dl></div>
    <div class="small" data-i="tel.note"></div>
  </div>
  <div class="pane" id="p-evs">
    <div class="chips"><button data-f="0" class="on" data-i="ev.all"></button><button data-f="1">Voyager 1</button><button data-f="2">Voyager 2</button></div>
    <div id="evList"></div>
  </div>
  <div class="pane" id="p-stars">
    <h4 data-i="st.h1"></h4>
    <div id="appr"><span class="small" data-i="st.calc"></span></div>
    <h4 data-i="st.h2"></h4>
    <div id="nearNow"></div>
  </div>
  <div class="pane" id="p-about"></div>
</aside>

<div id="opt">
  <b data-i="o.h1"></b>
  <label><input type="checkbox" id="oOrb" checked> <span data-i="o.orb"></span></label>
  <label><input type="checkbox" id="oLab" checked> <span data-i="o.lab"></span></label>
  <label><input type="checkbox" id="oHel" checked> <span data-i="o.hel"></span></label>
  <label><input type="checkbox" id="oOort" checked> <span data-i="o.oort"></span></label>
  <label><input type="checkbox" id="oStar" checked> <span data-i="o.star"></span></label>
  <label><input type="checkbox" id="oRing" checked> <span data-i="o.ring"></span></label>
  <label><input type="checkbox" id="oFut" checked> <span data-i="o.fut"></span></label>
  <label><input type="checkbox" id="oGal" checked> <span data-i="o.gal"></span></label>
  <label><input type="checkbox" id="oAuto" checked> <span data-i="o.auto"></span></label>
  <label><input type="checkbox" id="oCor"> <span data-i="o.cor"></span></label>
  <b data-i="o.h2"></b>
  <select id="selFocus" data-ia="aria-label:a.focus"><option value="sun" data-i="o.sun"></option><option value="v1">Voyager 1</option><option value="v2">Voyager 2</option><option value="mid" data-i="o.mid"></option></select>
  <button id="bReset" data-i="o.reset"></button>
  <b data-i="o.lang"></b>
  <div id="lang" role="group" data-ia="aria-label:o.lang"></div>
</div>

<div id="goto" role="dialog" aria-modal="true" aria-labelledby="gTitle"><div class="gbox">
  <div class="ghead"><b id="gTitle" data-i="g.title"></b><button id="gX" data-ia="aria-label:g.close">✕</button></div>
  <div class="gsec"><div class="glab" data-i="g.date"></div>
    <div class="ggrid">
      <label><span data-i="g.day"></span><input id="gD" type="number" min="1" max="31" inputmode="numeric"></label>
      <label><span data-i="g.month"></span><select id="gM"></select></label>
      <label><span data-i="g.year"></span><input id="gY" type="number" step="1" inputmode="numeric"></label>
      <label><span data-i="g.hour"></span><input id="gH" type="time"></label>
    </div>
    <button id="gGo" class="pri" data-i="g.go"></button></div>
  <div class="gsec"><div class="glab" data-i="g.rel"></div>
    <div class="ggrid2"><select id="gS" data-ia="aria-label:a.gs"><option value="1" data-i="g.after"></option><option value="-1" data-i="g.before"></option></select><input id="gN" type="number" min="0" step="any" value="100" inputmode="decimal" data-ia="aria-label:a.gn"><select id="gU" data-ia="aria-label:a.gu"><option value="0.0027379" data-i="g.ud"></option><option value="0.0833333" data-i="g.umo"></option><option value="1" selected data-i="g.uy"></option><option value="1000" data-i="g.uky"></option><option value="1000000" data-i="g.umy"></option><option value="1000000000" data-i="g.uby"></option></select></div>
    <button id="gGo2" class="pri" data-i="g.go2"></button></div>
  <div class="gsec"><div class="glab" data-i="g.quick"></div><div id="gChips" class="chips"></div></div>
  <div id="gMsg" class="small"></div>
</div></div>

<section id="ctl">
  <div class="row">
    <button id="bStart" data-ia="title:t.start;aria-label:a.start">⏮</button>
    <button id="bPlay" data-ia="title:t.play">▶<span class="lbl"> …</span></button>
    <button id="bNow" data-i="ctl.now" data-ia="title:t.now;aria-label:a.now"></button>
    <button id="bGo" data-ia="title:t.go;aria-label:a.go">📅<span class="lbl"> <span data-i="ctl.date"></span></span></button>
    <select id="selRate" data-ia="title:t.rate;aria-label:a.rate"></select>
    <span id="tLabel"></span><button id="bMore" data-ia="title:t.more;aria-label:a.more">▾</button>
  </div>
  <div class="sl"><input type="range" id="tSl" min="0" max="1000" step="0.02" value="0" data-ia="aria-label:a.time"><div id="ticks"></div></div>
  <div class="row zrow">
    <span class="small lbl" data-i="ctl.scale"></span>
    <input type="range" id="zSl" min="-1.3" max="10.5" step="0.005" data-ia="aria-label:a.zoom">
    <select id="selZ" data-ia="aria-label:a.selz"></select>
  </div>
</section>

<script>
/*MODEL-START*/
const M=(function(){
const PI=Math.PI, D2R=PI/180, TWO_PI=2*PI;
const GM=4*PI*PI;                 // UA^3 / an^2
const KMS=0.2109495;              // 1 km/s in UA/an
const AU_KM=149597870.7, LY_AU=63241.077, PC_AU=206264.806, LD_AU=173.14463, AU_PC=1/PC_AU;
const EPS=23.43929*D2R, CE=Math.cos(EPS), SE=Math.sin(EPS);
const norm=v=>Math.hypot(v[0],v[1],v[2]);
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));

function jd(y,m,d,h){h=h||0;const a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;
  const n=d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045;return n-0.5+h/24;}
const T=(y,m,d,h)=>(jd(y,m,d,h||0)-2451545)/365.25;
function calFromJD(J){J+=0.5;const Z=Math.floor(J),F=J-Z;const al=Math.floor((Z-1867216.25)/36524.25);const A=Z+1+al-Math.floor(al/4);
  const B=A+1524,C=Math.floor((B-122.1)/365.25),Dd=Math.floor(365.25*C),E=Math.floor((B-Dd)/30.6001);
  const day=B-Dd-Math.floor(30.6001*E),month=E<14?E-1:E-13,year=month>2?C-4716:C-4715;return {y:year,m:month,d:day,h:F*24};}
const TAU0=T(2026,11,5,0);

// ---- planete: elemente medii (Standish, 1800-2050) ----
const EL=[
['Mercur',0.38709927,0.20563593,7.00497902,252.25032350,77.45779628,48.33076593,0.00000037,0.00001906,-0.00594749,149472.67411175,0.16047689,-0.12534081],
['Venus',0.72333566,0.00677672,3.39467605,181.97909950,131.60246718,76.67984255,0.00000390,-0.00004107,-0.00078890,58517.81538729,0.00268329,-0.27769418],
['Pământ',1.00000261,0.01671123,-0.00001531,100.46457166,102.93768193,0.0,0.00000562,-0.00004392,-0.01294668,35999.37244981,0.32327364,0.0],
['Marte',1.52371034,0.09339410,1.84969142,-4.55343205,-23.94362959,49.55953891,0.00001847,0.00007882,-0.00813131,19140.30268499,0.44441088,-0.29257343],
['Jupiter',5.20288700,0.04838624,1.30439695,34.39644051,14.72847983,100.47390909,-0.00011607,-0.00013253,-0.00183714,3034.74612775,0.21252668,0.20469106],
['Saturn',9.53667594,0.05386179,2.48599187,49.95424423,92.59887831,113.66242448,-0.00125060,-0.00050991,0.00193609,1222.49362201,-0.41897216,-0.28867794],
['Uranus',19.18916464,0.04725744,0.77263783,313.23810451,170.95427630,74.01692503,-0.00196176,-0.00004397,-0.00242939,428.48202785,0.40805281,0.04240589],
['Neptun',30.06992276,0.00859048,1.77004347,-55.12002969,44.96476227,131.78422574,0.00026291,0.00005105,0.00035372,218.45945325,-0.32241464,-0.00508664]];
function kepler(Mm,e){let E=Mm+e*Math.sin(Mm);for(let i=0;i<12;i++)E-=(E-e*Math.sin(E)-Mm)/(1-e*Math.cos(E));return E;}
function elemAt(i,T){const q=EL[i],Tc=clamp(T,-3,3);
  return {a:q[1]+q[7]*Tc,e:q[2]+q[8]*Tc,I:(q[3]+q[9]*Tc)*D2R,L:q[4]+q[10]*T,w:q[5]+q[11]*Tc,O:(q[6]+q[12]*Tc)*D2R};}
function rotOrb(s,xp,yp){const om=s.w*D2R-s.O,cw=Math.cos(om),sw=Math.sin(om),cO=Math.cos(s.O),sO=Math.sin(s.O),cI=Math.cos(s.I),sI=Math.sin(s.I);
  return [(cw*cO-sw*sO*cI)*xp+(-sw*cO-cw*sO*cI)*yp,(cw*sO+sw*cO*cI)*xp+(-sw*sO+cw*cO*cI)*yp,(sw*sI)*xp+(cw*sI)*yp];}
function planetPos(i,tau){const s=elemAt(i,tau/100);let Mm=(((s.L-s.w)%360)+540)%360-180;Mm*=D2R;const E=kepler(Mm,s.e);
  return rotOrb(s,s.a*(Math.cos(E)-s.e),s.a*Math.sqrt(1-s.e*s.e)*Math.sin(E));}

// ---- cadre de coordonate ----
const ecl2eq=v=>[v[0],v[1]*CE-v[2]*SE,v[1]*SE+v[2]*CE];

// ---- dinamica galactică locală (ecuațiile Hill / epiciclice) ----
const KMS_PCMYR=1.0227121650537077;
const OMEGA=27.2*1.0227e-3, KAPPA=35.98*1.0227e-3, NU=0.080;   // rad/Mil. ani
const R0_PC=8200, DISK_PC=15000;
function makeHill(tref,pE,vE){ // pE in UA, vE in km/s (ecliptic, relativ la Soare)
  const pg=ecl2gal(pE).map(x=>x*AU_PC), vg=ecl2gal(vE).map(x=>x*KMS_PCMYR);
  const x=-pg[0],y=pg[1],z=pg[2],ux=-vg[0],uy=vg[1],uz=vg[2];
  return {tref,s:[x,y,z,ux+OMEGA*y,uy-OMEGA*x,uz]};}
function hillState(o,tau){const t=(tau-o.tref)*1e-6,s=o.s,x0=s[0],y0=s[1],z0=s[2],vx0=s[3],vy0=s[4],vz0=s[5];
  const xg=(2*OMEGA*vy0+4*OMEGA*OMEGA*x0)/(KAPPA*KAPPA),c=Math.cos(KAPPA*t),sn=Math.sin(KAPPA*t);
  const x=xg+(x0-xg)*c+vx0/KAPPA*sn;
  const y=y0+vy0*t-2*OMEGA*((xg-x0)*t+(x0-xg)*sn/KAPPA+vx0*(1-c)/(KAPPA*KAPPA));
  const z=z0*Math.cos(NU*t)+vz0/NU*Math.sin(NU*t);
  return [x,y,z,t];}
function hillToEcl(x,y,z,t,corot){let X=x,Y=y;if(!corot){const a=OMEGA*t,c=Math.cos(a),s=Math.sin(a);X=x*c-y*s;Y=x*s+y*c;}
  return gal2ecl([-X,Y,z]).map(v=>v*PC_AU);}
function hillPos(o,tau,corot){const h=hillState(o,tau);return hillToEcl(h[0],h[1],h[2],h[3],corot);}

// ---- stele apropiate (valori aproximative, J2000) ----
const STARS_DEF=[
['Proxima Centauri',217.429,-62.680,4.2465,-3781.7,769.5,-22.2,'#ff8f70'],
['α Centauri',219.902,-60.834,4.367,-3679.3,473.7,-21.4,'#ffe9b0'],
['Steaua lui Barnard',269.452,4.693,5.963,-802.8,10362.5,-110.5,'#ff9a78'],
['Wolf 359',164.120,7.015,7.86,-3866,-2699,19.5,'#ff8a6a'],
['Lalande 21185',165.834,35.970,8.31,-580.5,-4776.6,-84.7,'#ff9f7d'],

['61 Cygni',316.725,38.749,11.40,4164.2,3249.5,-65.7,'#ffc58a'],

['Altair',297.696,8.868,16.73,536.2,385.5,-26.1,'#f2f6ff'],
['Gliese 445',176.9224,78.6912,17.137,748.4,480.8,-111.5,'#ff9a78'],
['Vega',279.235,38.784,25.04,200.9,287.5,-13.9,'#dfe9ff'],
['Fomalhaut',344.413,-29.622,25.13,329.2,-164.7,6.5,'#e8f0ff'],
['Arcturus',213.915,19.182,36.7,-1093.4,-1999.4,-5.2,'#ffc890'],
['Gliese 710',274.962,-1.939,62.4,-1.7,-1.4,-14.4,'#ffb08a']];
const STARS=STARS_DEF.map(q=>{const ra=q[1]*D2R,dec=q[2]*D2R,dAU=q[3]*LY_AU,dpc=dAU*AU_PC,eq=radec(ra,dec);
  const e=[-Math.sin(ra),Math.cos(ra),0],nn=[-Math.sin(dec)*Math.cos(ra),-Math.sin(dec)*Math.sin(ra),Math.cos(dec)];
  const k=4.74047*dpc/1000,a=q[4]*k,b=q[5]*k;
  const vEq=[0,1,2].map(i=>q[6]*eq[i]+a*e[i]+b*nn[i]);
  const p=eq2ecl(eq.map(c=>c*dAU)),v=eq2ecl(vEq);
  return {name:q[0],col:q[7],d0:q[3],speed:norm(v),hill:makeHill(0,p,v)};});
function starPos(s,tau,corot){return hillPos(s.hill,tau,corot);}

// ---- sondele ----
function cyl(p){let th=Math.atan2(p[1],p[0]);if(th<0)th+=TWO_PI;return {r:Math.hypot(p[0],p[1]),th,z:p[2]};}
function polarSeg(A,B){let dth=((B.th-A.th)%TWO_PI+TWO_PI)%TWO_PI;const N=64,G=new Float64Array(N+1);
  const f=u=>1-Math.pow(1-u,1.5);let prev=1/Math.pow(A.r+(B.r-A.r)*f(0),2);
  for(let i=1;i<=N;i++){const r=A.r+(B.r-A.r)*f(i/N),c=1/(r*r);G[i]=G[i-1]+(prev+c)/2/N;prev=c;}
  const Gt=G[N];
  return function(u){u=clamp(u,0,1);const r=A.r+(B.r-A.r)*f(u),x=u*N,i=Math.min(N-1,Math.floor(x)),g=G[i]+(G[i+1]-G[i])*(x-i);
    const th=A.th+dth*g/Gt,s=u*u*(3-2*u),z=A.z+(B.z-A.z)*s;return [r*Math.cos(th),r*Math.sin(th),z];};}
// ---- arce balistice (problema Lambert, conice heliocentrice) între întâlniri ----
function stumpff(z){if(z>1e-8){const s=Math.sqrt(z);return [(1-Math.cos(s))/z,(s-Math.sin(s))/(s*z)];}if(z<-1e-8){const s=Math.sqrt(-z);return [(Math.cosh(s)-1)/(-z),(Math.sinh(s)-s)/(s*(-z))];}return [0.5-z/24,1/6-z/120];}
const dot3=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
function lambertSolve(r1,r2,tof){const R1=norm(r1),R2=norm(r2),sm=Math.sqrt(GM);
  let dnu=Math.acos(clamp(dot3(r1,r2)/(R1*R2),-1,1));if(r1[0]*r2[1]-r1[1]*r2[0]<0)dnu=TWO_PI-dnu;
  const sd=Math.sin(dnu),cd=Math.cos(dnu);if(Math.abs(sd)<1e-4||!(tof>0))return null;
  const A=sd*Math.sqrt(R1*R2/(1-cd));
  const yf=z=>{const c=stumpff(z);return R1+R2+A*(z*c[1]-1)/Math.sqrt(c[0]);};
  const tf=z=>{const y=yf(z);if(!(y>=0))return NaN;const c=stumpff(z);return (Math.pow(y/c[0],1.5)*c[1]+A*Math.sqrt(y))/sm;};
  let lo=-4000,hi=TWO_PI*TWO_PI-1e-3;while(!(yf(lo)>=0)&&lo<-1e-4)lo*=0.85;
  if(!(tf(hi)>=tof)||!(tf(lo)<=tof))return null;
  for(let i=0;i<120;i++){const mid=(lo+hi)/2,t=tf(mid);if(t<tof)lo=mid;else hi=mid;}
  const z=(lo+hi)/2,y=yf(z),f=1-y/R1,g=A*Math.sqrt(y/GM);if(!(g>0))return null;
  return [0,1,2].map(i=>(r2[i]-f*r1[i])/g);}
function propagateKep(r0,v0,dt){if(dt===0)return r0.slice();const R0=norm(r0),sm=Math.sqrt(GM),vr0=dot3(r0,v0)/R0,alpha=2/R0-dot3(v0,v0)/GM;
  let chi=Math.abs(alpha)>1e-9?sm*Math.abs(alpha)*dt:sm*dt/R0;
  for(let i=0;i<80;i++){const z=alpha*chi*chi,c=stumpff(z),C=c[0],S=c[1];
    const F=R0*vr0/sm*chi*chi*C+(1-alpha*R0)*chi*chi*chi*S+R0*chi-sm*dt;
    const dF=R0*vr0/sm*chi*(1-z*S)+(1-alpha*R0)*chi*chi*C+R0;const dc=F/dF;if(!isFinite(dc))break;chi-=dc;if(Math.abs(dc)<1e-12)break;}
  const z=alpha*chi*chi,c=stumpff(z),f=1-chi*chi/R0*c[0],g=dt-chi*chi*chi/sm*c[1];
  return [0,1,2].map(i=>f*r0[i]+g*v0[i]);}
function arcSeg(pa,pb,ta,tb){const tof=tb-ta,v1=lambertSolve(pa,pb,tof);
  if(v1&&v1.every(isFinite)){const chk=propagateKep(pa,v1,tof);if(norm(sub(chk,pb))<1e-4*norm(pb)){const f=u=>propagateKep(pa,v1,clamp(u,0,1)*tof);f.ballistic=true;return f;}}
  return polarSeg(cyl(pa),cyl(pb));}
function buildLine(pS,pE,Ty){const d=sub(pE,pS),L=norm(d),u=mul(d,1/L),N=500;
  function run(vinf,st){let t=0,sp=0,vp=Math.sqrt(vinf*vinf+2*GM/norm(pS));if(st){st.s[0]=0;st.t[0]=0;}
    for(let i=1;i<=N;i++){const s=L*Math.pow(i/N,2),q=[pS[0]+u[0]*s,pS[1]+u[1]*s,pS[2]+u[2]*s],v=Math.sqrt(vinf*vinf+2*GM/norm(q));
      t+=(s-sp)*0.5*(1/vp+1/v);sp=s;vp=v;if(st){st.s[i]=s;st.t[i]=t;}}return t;}
  let lo=0.3,hi=9;for(let k=0;k<70;k++){const mid=(lo+hi)/2;if(run(mid)>Ty)lo=mid;else hi=mid;}
  const vinf=(lo+hi)/2,st={s:new Float64Array(N+1),t:new Float64Array(N+1)};run(vinf,st);return {u,L,vinf,pS,st,N};}
function lineAt(ln,t){const st=ln.st;let a=0,b=ln.N;t=clamp(t,0,st.t[ln.N]);while(b-a>1){const m=(a+b)>>1;if(st.t[m]<=t)a=m;else b=m;}
  const f=(t-st.t[a])/Math.max(1e-12,st.t[b]-st.t[a]),s=st.s[a]+(st.s[b]-st.s[a])*f;
  return [ln.pS[0]+ln.u[0]*s,ln.pS[1]+ln.u[1]*s,ln.pS[2]+ln.u[2]*s];}
function buildFuture(V){const vinf=V.line.vinf,u=V.line.u,p0=V.p0,tmin=1e-4,N=2800,lo=Math.log10(tmin),hi=Math.log10(2e9),dl=(hi-lo)/N;
  const E=new Float64Array(N+1);let s=0,t=tmin,r=norm(p0),v=Math.sqrt(vinf*vinf+2*GM/r);s=v*tmin;E[0]=s-vinf*t;
  const at=ss=>norm([p0[0]+u[0]*ss,p0[1]+u[1]*ss,p0[2]+u[2]*ss]);
  for(let i=1;i<=N;i++){const tn=Math.pow(10,lo+i*dl),dt=tn-t,v1=Math.sqrt(vinf*vinf+2*GM/at(s)),v2=Math.sqrt(vinf*vinf+2*GM/at(s+v1*dt));
    s+=0.5*(v1+v2)*dt;t=tn;E[i]=s-vinf*t;}
  return {E,lo,dl,N,v0:Math.sqrt(vinf*vinf+2*GM/norm(p0))};}
function eAlong(V,D){const F=V.fut;if(D<=0)return 0;if(D<=1e-4)return (F.v0-V.line.vinf)*D;
  const x=(Math.log10(D)-F.lo)/F.dl,i=Math.min(F.N-1,Math.floor(x));return F.E[i]+(F.E[i+1]-F.E[i])*(x-i);}

const VDEF=[
 {id:1,name:'Voyager 1',col:'#ffb347',launch:T(1977,9,5,12.9),enc:[{pl:4,t:T(1979,3,5,12.1)},{pl:5,t:T(1980,11,12,23.8)}],r0:172.3,ra:258.0,dec:12.2,ts:T(2004,12,16),hp:T(2012,8,25)},
 {id:2,name:'Voyager 2',col:'#4fc3f7',launch:T(1977,8,20,14.4),enc:[{pl:4,t:T(1979,7,9,22.0)},{pl:5,t:T(1981,8,26,3.0)},{pl:6,t:T(1986,1,24,17.9)},{pl:7,t:T(1989,8,25,3.9)}],r0:145.1,ra:299.0,dec:-56.0,ts:T(2007,8,30),hp:T(2018,11,5)}];
const VOY=VDEF.map(d=>{
  const knots=[{t:d.launch,p:planetPos(2,d.launch)}].concat(d.enc.map(e=>({t:e.t,p:planetPos(e.pl,e.t)})));
  const p0=eq2ecl(radec(d.ra*D2R,d.dec*D2R)).map(c=>c*d.r0),last=knots[knots.length-1];
  const line=buildLine(last.p,p0,TAU0-last.t);
  const segs=[];for(let i=0;i<knots.length-1;i++)segs.push({t1:knots[i].t,t2:knots[i+1].t,f:arcSeg(knots[i].p,knots[i+1].p,knots[i].t,knots[i+1].t)});
  const V={id:d.id,name:d.name,col:d.col,launch:d.launch,ts:d.ts,hp:d.hp,knots,segs,p0,line,tLast:last.t,enc:d.enc,
    hill:makeHill(TAU0,p0,mul(line.u,line.vinf/KMS))};
  V.fut=buildFuture(V);
  V.vNow=Math.sqrt(line.vinf*line.vinf+2*GM/d.r0)/KMS;
  return V;});
function voyPos(V,tau,corot){
  if(tau<=V.launch)return planetPos(2,tau);
  if(tau<=V.tLast){for(const s of V.segs){if(tau<=s.t2)return s.f((tau-s.t1)/(s.t2-s.t1));}}
  if(tau<=TAU0)return lineAt(V.line,tau-V.tLast);
  const h=hillPos(V.hill,tau,corot),e=eAlong(V,tau-TAU0),u=V.line.u;
  return [h[0]+u[0]*e,h[1]+u[1]*e,h[2]+u[2]*e];}
function voySpeed(V,tau){if(tau<=V.launch)return 29.8;const h=Math.max(0.005,tau>TAU0?1e-3*(tau-TAU0):0.005);
  const a=voyPos(V,tau-h,false),b=voyPos(V,tau+h,false);return norm(sub(b,a))/(2*h)/KMS;}

function findR(V,R){let D=0.01;while(D<2e9&&norm(voyPos(V,TAU0+D,false))<R)D*=1.5;if(D>=2e9)return null;
  let lo=TAU0+D/1.5,hi=TAU0+D;for(let i=0;i<60;i++){const m=(lo+hi)/2;if(norm(voyPos(V,m,false))<R)lo=m;else hi=m;}return (lo+hi)/2;}
function findEarth(V,R){let prev=null,tp=TAU0-2;for(let t=TAU0-2;t<=TAU0+8;t+=5/365.25){const f=earthDist(V,t,false)-R;
  if(prev!==null&&prev<0&&f>=0){let lo=tp,hi=t;for(let i=0;i<50;i++){const m=(lo+hi)/2;if(earthDist(V,m,false)<R)lo=m;else hi=m;}return (lo+hi)/2;}prev=f;tp=t;}return null;}
function closest(V,S,tmaxD){let best=1e30,bt=0;for(let D=0;D<=tmaxD;D+=D<4e5?100:400){const t=TAU0+D,d=norm(sub(voyPos(V,t,false),starPos(S,t,false)));if(d<best){best=d;bt=t;}}
  let lo=bt-400,hi=bt+400;for(let k=0;k<40;k++){const a=lo+(hi-lo)/3,b=hi-(hi-lo)/3;if(norm(sub(voyPos(V,a,false),starPos(S,a,false)))<norm(sub(voyPos(V,b,false),starPos(S,b,false))))hi=b;else lo=a;}
  const t=(lo+hi)/2;return {t,d:norm(sub(voyPos(V,t,false),starPos(S,t,false)))};}
function closestSun(S,tmaxD){let best=1e30,bt=0;for(let D=-1e5;D<=tmaxD;D+=200){const d=norm(starPos(S,TAU0+D,false));if(d<best){best=d;bt=TAU0+D;}}return {t:bt,d:best};}
return {PI,D2R,GM,KMS,AU_KM,LY_AU,PC_AU,LD_AU,TAU0,T,jd,calFromJD,EL,planetPos,planetOrbit,STARS,starPos,VOY,voyPos,voySpeed,earthDist,findR,findEarth,closest,closestSun,
  hillToEcl,OMEGA,R0_PC,DISK_PC,ecl2eq,eq2ecl,gal2ecl,ecl2gal,norm,sub};
})();

at {1} (linear model + local galactic dynamics).","ap.l":"→ {0}","ap.t":"Closest approach to {0}","ap.x":"≈{0} ly between the probe and the star (model, approximate catalog values).","ap.star":"Star","ap.when":"When","ap.dist":"Distance","ap.lit":"Literature vs. model","ap.pair":"Probe · star","ap.litc":"Literature","ap.modc":"Model","ap.note":"Literature: NASA/JPL, via Wikipedia. Over light-year distances, an error of a few degrees in a probe's direction of motion changes the minimum distance by tenths of a light-year or more (for Sirius, over two light-years), so the model's values are only indicative.","ab.h1":"What the app shows","ab.p1":"The paths of the two Voyager probes from 1977 to a future up to 1 billion years away, at any scale: from Earth's orbit to the disk of the Milky Way. The 1 light-day circle (≈173 AU) is the milestone Voyager 1 is heading towards in 2026–2027.","ab.h2":"How it is computed","ab.p2":"<b>Planets:<\/b> mean Keplerian orbital elements (JPL, valid 1800–2050). <b>Until 5 Nov 2026:<\/b> ballistic arcs (heliocentric conics, the Lambert problem) from launch to each planet, on the actual flyby dates; gravity assists appear as sudden changes of speed at the planet. Then a straight line with solar gravitational deceleration, calibrated to reach the position of 5 Nov 2026. <b>After 2026:<\/b> inertial motion plus the Sun's correction, and over the long term the Galaxy's pull through the epicyclic (Hill) equations with Oort constants A=15.3 and B=−11.9 km/s/kpc and a vertical frequency of ≈0.08 rad/Myr. <b>Stars:<\/b> J2000 positions, parallax, proper motion and approximate radial velocity, propagated with the same dynamics.","ab.h3":"Limits","ab.p3":"The 2026 positions (distance, direction) are approximations; at light-year scales they differ from JPL ephemerides. No pull from other bodies and no trajectory corrections; planetary flybys are treated as points (patched conics). The galactic model is a linearization around the Sun's orbit: accurate over tens of millions of years, indicative from hundreds of millions of years onward, when the probes are kiloparsecs from the Sun. The dates for the end of transmission are estimates, not official predictions.","ab.h4":"Current date","ab.p4":"On start-up the app syncs with the device clock (“Real time” mode): relative dates (“ago”, “in”) and the “today” marker on the path refer to today. The probes' position is extrapolated from the last calibrated position (5 Nov 2026), valid for any later date; the “Now” button returns to real time at any moment.","ab.h5":"A specific moment","ab.p5":"The “📅 Date” button opens a window where you can pick an exact calendar date (time in UTC, from the launches to +1 billion years), an interval relative to today (“in 250 years”, “10 years ago”) or a quick moment. After you choose, “Play” continues from there, at 1 year per second. The page address gets a <b>#t=<\/b> marker that can be saved or sent.","ab.h6":"Controls","ab.p6":"Drag on the screen to rotate, wheel / pinch to zoom (this turns off auto-zoom), double-click to reset the angle. Space = play / pause. The “co-rotating” frame shows the path in the system that rotates with the Galaxy.","ab.h7":"The Golden Record","ab.p7":"Each probe carries a gold-plated copper disc with sounds and images of Earth, as a message for a possible discovery in the very distant future.","ab.src":"Mission data source: NASA/JPL. A single-file app that works without internet."},"ro":{"title":"VOIAJOR — Voyager 1 și 2, de la lansare în viitorul îndepărtat","desc":"Simulare detaliată a traseului sondelor Voyager 1 și 2, din 1977 până peste un miliard de ani, la orice scară.","brand":"Voyager 1 · Voyager 2 — de la lansare până în viitorul îndepărtat","b.data":"Date","b.opt":"Opțiuni","tab.tel":"Telemetrie","tab.ev":"Evenimente","tab.stars":"Stele","tab.about":"Despre","tel.note":"Mărimile se referă la momentul simulat. După 2026 totul este extrapolare.","ev.all":"Ambele","ev.both":"Ambele sonde","st.h1 lui Voyager 1, pe o traiectorie mai lentă.","ev.v2.jup":"≈570 000 km de centrul planetei.","ev.v2.sat":"≈101 000 km; asistență gravitațională spre Uranus.","ev.v2.ura":"≈81 500 km. Singura vizită a unei sonde.","ev.v2.nep":"≈4 950 km deasupra norilor; apoi Triton. Traiectoria coboară spre sud.","ev.v2.ts":"≈84 UA.","ev.v2.hp":"≈119 UA: a doua sondă în spațiul interstelar, cu instrumentul plasmatic funcțional.","ev.ld.l":"1 zi-lumină","ev.ldE.t":"1 zi-lumină de Pământ","ev.ldE.x":"Semnalul radio are nevoie de 24 de ore într-un sens. (Dată calculată de model; NASA a indicat noiembrie 2026 pentru acest reper.)","ev.ldS.t":"1 zi-lumină de Soare","ev.ldS.x":"≈173 UA față de Soare (heliocentric).","ev.sil.l":"≈ anii 2030","ev.sil.t":"Estimare: tăcerea radio","ev.sil.x":"Generatorii cu plutoniu scad cu ≈4 W/an; instrumentele se sting pe rând, iar sondele rămân fără transmisie. Datare orientativă.","ev.oort.l":"Norul Oort","ev.oortIn.t":"Intrare în Norul Oort interior","ev.v1.oortIn":"≈1 000 UA (peste ≈250 de ani).","ev.v2.oortIn":"≈1 000 UA.","ev.oortOut.l":"Oort exterior","ev.oortOut.t":"Norul Oort exterior","ev.v1.oortOut":"≈20 000 UA.","ev.ly.l":"1 an-lumină","ev.ly.t":"1 an-lumină de Soare","ev.ly.x":"63 241 UA.","ev.oortEdge.l":"Marginea Oort","ev.oortEdge.t":"Ieșirea din Norul Oort","ev.v1.oortEdge":"≈100 000 UA; traversarea durează ≈30 000 de ani.","ev.v2.oortEdge":"≈100 000 UA.","ev.p1m":"+1 milion de ani","ev.p10m":"+10 milioane de ani","ev.p100m":"+100 milioane de ani","ev.p1b":"+1 miliard de ani","ev.dyn":"V1 la {0} de Soare; V2 la {1} (model liniar + dinamică galactică locală).","ap.l":"→ {0}","ap.t":"Cea mai mică distanță față de {0}","ap.x":"≈{0} a.l. între sondă și stea (model, valori aproximative ale catalogului).","ap.star":"Stea","ap.when":"Când","ap.dist":"Distanță","ap.lit":"Literatură față de model","ap.pair":"Sondă · stea","ap.litc":"Literatură","ap.modc":"Model","ap.note":"Literatura: NASA/JPL, prin Wikipedia. Pe distanțe de ani-lumină, o abatere de câteva grade în direcția vitezei unei sonde schimbă distanța minimă cu zecimi de an-lumină sau mai mult (la Sirius, peste doi ani-lumină), așa că valorile modelului sunt orientative.","ab.h1":"Ce arată aplicația","ab.p1":"Traseul celor două sonde Voyager din 1977 până într-un viitor de până la 1 miliard de ani, la orice scară: de la orbita Pământului la discul Căii Lactee. Cercul de 1 zi-lumină (≈173 UA) este reperul spre care se îndreaptă Voyager 1 în 2026–2027.","ab.h2":"Cum e calculat","ab.p2":"<b>Planetele:<\/b> elemente orbitale kepleriene medii (JPL, valabile 1800–2050). <b>Până la 5 nov. 2026:<\/b> arce balistice (conice heliocentrice, problema Lambert) de la lansare la fiecare planetă, la datele reale ale zborurilor; asistențele gravitaționale apar ca schimbări bruște de viteză la planetă. Apoi o dreaptă cu frânare gravitațională solară, calibrată să ajungă în poziția din 5 nov. 2026. <b>După 2026:<\/b> mișcare inerțială plus corecția Soarelui, iar pe timp lung atracția Galaxiei prin ecuațiile epiciclice (Hill) cu constantele Oort A=15,3 și B=−11,9 km/s/kpc și frecvența verticală ≈0,08 rad/Mil. ani. <b>Stelele:<\/b> poziții J2000, paralaxă, mișcare proprie și viteză radială aproximative, propagate cu aceeași dinamică.","ab.h3":"Limite","ab.p3":"Pozițiile din 2026 (distanță, direcție) sunt aproximări; la scară de ani-lumină apar diferențe față de efemeridele JPL. Fără atracția altor corpuri și fără corecții de traiectorie; zborurile pe lângă planete sunt tratate ca puncte (conice îmbinate). Modelul galactic este o liniarizare în jurul orbitei Soarelui: precis pe zeci de milioane de ani, orientativ de la sute de milioane de ani în sus, când sondele ajung la kiloparseci de Soare. Datările despre sfârșitul transmisiei sunt estimări, nu predicții oficiale.","ab.h4":"Data curentă","ab.p4":"La pornire aplicația se sincronizează cu ceasul dispozitivului (modul „Timp real”): datele relative („acum”, „peste”) și marcajul „azi” de pe traseu se raportează la ziua de azi. Poziția sondelor se extrapolează din ultima poziție calibrată (5 nov. 2026), valabilă pentru orice dată ulterioară; butonul „Acum” revine oricând la timp real.","ab.h5":"Un moment anume","ab.p5":"Butonul „📅 Dată” deschide o fereastră în care poți alege o dată calendaristică exactă (oră în UTC, de la lansări până la +1 miliard de ani), un interval față de azi („peste 250 de ani”, „acum 10 ani”) sau un moment rapid. După alegere, „Redare” continuă de acolo, cu 1 an pe secundă. Adresa paginii primește un marcaj <b>#t=<\/b> care poate fi salvat sau trimis.","ab.h6":"Comenzi","ab.p6":"Trage pe ecran pentru a roti, rotița / ciupirea pentru zoom (oprește zoomul automat), dublu-clic pentru a reseta unghiul. Spațiu = redare / pauză. Cadrul „co-rotativ” arată traseul în sistemul care se învârte odată cu Galaxia.","ab.h7":"Discul de Aur","ab.p7":"Fiecare sondă poartă un disc de cupru placat cu aur, cu sunete și imagini de pe Pământ, ca mesaj pentru o eventuală descoperire în viitorul foarte îndepărtat.","ab.src":"Sursa datelor misiunii: NASA/JPL. Aplicație cu un singur fișier, funcționează fără internet."},"fr":{"title":"VOIAJOR — Voyager 1 et 2, du lancement au futur lointain","desc":"Simulation détaillée des trajectoires de Voyager 1 et 2, de 1977 à plus d’un milliard d’années dans le futur, à toutes les échelles.","brand":"Voyager 1 · Voyager 2 — du lancement au futur lointain","b.data":"Données","b.opt":"Options","tab.tel":"Télémétrie","tab.ev":"Événements","tab.stars":"Étoiles","tab.about":"À propos","tel.note":"Les valeurs se rapportent à l’instant simulé. Après 2026, tout est extrapolation.","ev.all":"Les deux","ev.both":"Les deux sondes","st.h1":"Approches les plus proches d’étoiles (modèle, à partir de 2026)","st.calc":"Calcul en cours…","st.h2":"Étoiles les plus proches du Soleil à l’instant simulé","o.h1":"Affichage","o.orb":"Orbites des planètes","o.lab":"Étiquettes","o.hel":"Héliosphère (choc terminal, héliopause)","o.oort":"Nuage d’Oort","o.star":"Étoiles proch ":"Lancée 16 jours avant Voyager 1, sur une trajectoire plus lente.","ev.v2.jup":"≈570 000 km du centre de la planète.","ev.v2.sat":"≈101 000 km ; assistance gravitationnelle vers Uranus.","ev.v2.ura":"≈81 500 km. Seule visite d’une sonde.","ev.v2.nep":"≈4 950 km au-dessus des nuages ; puis Triton. La trajectoire plonge vers le sud.","ev.v2.ts":"≈84 UA.","ev.v2.hp":"≈119 UA : deuxième sonde dans l’espace interstellaire, avec un instrument à plasma en état de marche.","ev.ld.l":"1 jour-lumière","ev.ldE.t":"1 jour-lumière de la Terre","ev.ldE.x":"Un signal radio met 24 heures à l’aller. (Date calculée par le modèle ; la NASA a indiqué novembre 2026 pour cette étape.)","ev.ldS.t":"1 jour-lumière du Soleil","ev.ldS.x":"≈173 UA du Soleil (héliocentrique).","ev.sil.l":"≈ années 2030","ev.sil.t":"Estimation : silence radio","ev.sil.x":"Les générateurs au plutonium perdent ≈4 W par an ; les instruments s’éteignent un à un, et les sondes finissent sans transmission. Datation approximative.","ev.oort.l":"Nuage d’Oort","ev.oortIn.t":"Entrée dans le nuage d’Oort interne","ev.v1.oortIn":"≈1 000 UA (dans ≈250 ans).","ev.v2.oortIn":"≈1 000 UA.","ev.oortOut.l":"Oort externe","ev.oortOut.t":"Le nuage d’Oort externe","ev.v1.oortOut":"≈20 000 UA.","ev.ly.l":"1 année-lumière","ev.ly.t":"1 année-lumière du Soleil","ev.ly.x":"63 241 UA.","ev.oortEdge.l":"Bord d’Oort","ev.oortEdge.t":"Sortie du nuage d’Oort","ev.v1.oortEdge":"≈100 000 UA ; la traversée dure ≈30 000 ans.","ev.v2.oortEdge":"≈100 000 UA.","ev.p1m":"+1 million d’années","ev.p10m":"+10 millions d’années","ev.p100m":"+100 millions d’années","ev.p1b":"+1 milliard d’années","ev.dyn":"V1 à {0} du Soleil ; V2 à {1} (modèle linéaire + dynamique galactique locale).","ap.l":"→ {0}","ap.t":"Approche la plus proche de {0}","ap.x":"≈{0} a.l. entre la sonde et l’étoile (modèle, valeurs approximatives du catalogue).","ap.star":"Étoile","ap.when":"Quand","ap.dist":"Distance","ap.lit":"Littérature vs modèle","ap.pair":"Sonde · étoile","ap.litc":"Littérature","ap.modc":"Modèle","ap.note":"Littérature : NASA/JPL, via Wikipédia. À des distances de l’ordre de l’année-lumière, une erreur de quelques degrés sur la direction de déplacement d’une sonde modifie la distance minimale de quelques dixièmes d’année-lumière, voire plus (pour Sirius, plus de deux années-lumière) ; les valeurs du modèle ne sont donc qu’indicatives.","ab.h1":"Ce que montre l’application","ab.p1":"Les trajectoires des deux sondes Voyager de 1977 jusqu’à un futur situé à 1 milliard d’années, à toutes les échelles : de l’orbite terrestre au disque de la Voie lactée. Le cercle de 1 jour-lumière (≈173 UA) est l’étape vers laquelle Voyager 1 se dirige en 2026–2027.","ab.h2":"Comment c’est calculé","ab.p2":"<b>Planètes :<\/b> éléments orbitaux képlériens moyens (JPL, valables 1800–2050). <b>Jusqu’au 5 nov. 2026 :<\/b> arcs balistiques (coniques héliocentriques, problème de Lambert) du lancement à chaque planète, aux dates réelles de survol ; les assistances gravitationnelles apparaissent comme des changements brusques de vitesse à la planète. Ensuite, une droite avec décélération due à la gravité solaire, calibrée pour atteindre la position du 5 nov. 2026. <b>Après 2026 :<\/b> mouvement inertiel plus la correction du Soleil, et, à long terme, l’attraction de la Galaxie par les équations épicycliques (de Hill) avec les constantes d’Oort A=15,3 et B=−11,9 km/s/kpc et une fréquence verticale de ≈0,08 rad/Ma. <b>Étoiles :<\/b> positions J2000, parallaxe, mouvement propre et vitesse radiale approximative, propagées avec la même dynamique.","ab.h3":"Limites","ab.p3":"Les positions de 2026 (distance, direction) sont des approximations ; aux échelles de l’année-lumière, elles diffèrent des éphémérides du JPL. Aucune attraction d’autres corps et aucune correction de trajectoire ; les survols planétaires sont traités comme des points (coniques raccordées). Le modèle galactique est une linéarisation autour de l’orbite du Soleil : précis sur des dizaines de millions d’années, indicatif à partir de centaines de millions d’années, lorsque les sondes se trouvent à des kiloparsecs du Soleil. Les dates de fin de transmission sont des estimations, non des prévisions officielles.","ab.h4":"Date actuelle","ab.p4":"Au démarrage, l’application se synchronise avec l’horloge de l’appareil (mode “Temps réel”) : les dates relatives (“il y a”, “dans”) et le repère “aujourd’hui” sur la trajectoire se rapportent à aujourd’hui. La position des sondes est extrapolée à partir de la dernière position calibrée (5 nov. 2026), valable pour toute date ultérieure ; le bouton “Maintenant” ramène au temps réel à tout moment.","ab.h5":"Un instant précis","ab.p5":"Le bouton “📅 Date” ouvre une fenêtre où vous pouvez choisir une date exacte du calendrier (heure en UTC, des lancements à +1 milliard d’années), un intervalle relatif à aujourd’hui (“dans 250 ans”, “il y a 10 ans”) ou un instant rapide. Après votre choix, “Lecture” continue à partir de là, à 1 an par seconde. L’adresse de la page reçoit un marqueur <b>#t=<\/b> qui peut être enregistré ou envoyé.","ab.h6":"Commandes","ab.p6":"Faites glisser sur l’écran pour pivoter, molette / pincement pour zoomer (cela désactive le zoom auto), double-clic pour réinitialiser l’angle. Espace = lecture / pause. Le repère “co-rotatif” montre la trajectoire dans le système qui tourne avec la Galaxie.","ab.h7":"Le Disque d’or","ab.p7":"Chaque sonde emporte un disque de cuivre plaqué or contenant des sons et des images de la Terre, comme message pour une éventuelle découverte dans un futur très lointain.","ab.src":"Source des données de mission : NASA/JPL. Application en un seul fichier, fonctionnant sans internet."},"it":{"title":"VOIAJOR — Voyager 1 e 2, dal lancio al lontano futuro","desc":"Simulazione dettagliata delle traiettorie delle sonde Voyager 1 e 2, dal 1977 a oltre un miliardo di anni da oggi, a qualsiasi scala.","brand":"Voyager 1 · Voyager 2 — dal lancio al lontano futuro","b.data":"Dati","b.op i","ev.dyn":"V1 a {0} dal Sole; V2 a {1} (modello lineare + dinamica galattica locale).","ap.l":"→ {0}","ap.t":"Massimo avvicinamento a {0}","ap.x":"≈{0} a.l. tra la sonda e la stella (modello, valori di catalogo approssimati).","ap.star":"Stella","ap.when":"Quando","ap.dist":"Distanza","ap.lit":"Letteratura e modello","ap.pair":"Sonda · stella","ap.litc":"Letteratura","ap.modc":"Modello","ap.note":"Letteratura: NASA/JPL, tramite Wikipedia. Su distanze di anni luce, un errore di pochi gradi nella direzione di moto di una sonda cambia la distanza minima di alcuni decimi di anno luce o più (per Sirio, oltre due anni luce), quindi i valori del modello sono solo indicativi.","ab.h1":"Cosa mostra l’app","ab.p1":"Le traiettorie delle due sonde Voyager dal 1977 a un futuro fino a 1 miliardo di anni da oggi, a qualsiasi scala: dall’orbita della Terra al disco della Via Lattea. Il cerchio di 1 giorno luce (≈173 UA) è il traguardo verso cui si dirige Voyager 1 nel 2026–2027.","ab.h2":"Come viene calcolato","ab.p2":"<b>Pianeti:<\/b> elementi orbitali kepleriani medi (JPL, validi 1800–2050). <b>Fino al 5 nov 2026:<\/b> archi balistici (coniche eliocentriche, problema di Lambert) dal lancio a ciascun pianeta, alle date reali dei sorvoli; le fionde gravitazionali appaiono come bruschi cambi di velocità al pianeta. Poi una retta con decelerazione gravitazionale solare, calibrata per raggiungere la posizione del 5 nov 2026. <b>Dopo il 2026:<\/b> moto inerziale più la correzione del Sole e, sui tempi lunghi, l’attrazione della Galassia tramite le equazioni epicicliche di Hill con le costanti di Oort A=15,3 e B=−11,9 km/s/kpc e una frequenza verticale di ≈0,08 rad/Mln di anni. <b>Stelle:<\/b> posizioni J2000, parallasse, moto proprio e velocità radiale approssimata, propagati con la stessa dinamica.","ab.h3":"Limiti","ab.p3":"Le posizioni del 2026 (distanza, direzione) sono approssimazioni; a scala di anni luce differiscono dalle effemeridi JPL. Nessuna attrazione da altri corpi e nessuna correzione di traiettoria; i sorvoli planetari sono trattati come punti (coniche raccordate). Il modello galattico è una linearizzazione attorno all’orbita del Sole: accurato su decine di milioni di anni, indicativo da centinaia di milioni di anni in poi, quando le sonde si trovano a kiloparsec dal Sole. Le date della fine delle trasmissioni sono stime, non previsioni ufficiali.","ab.h4":"Data corrente","ab.p4":"All’avvio l’app si sincronizza con l’orologio del dispositivo (modalità «Tempo reale»): le date relative («fa», «tra») e il segnaposto «oggi» sulla traiettoria si riferiscono a oggi. La posizione delle sonde è estrapolata dall’ultima posizione calibrata (5 nov 2026), valida per qualsiasi data successiva; il pulsante «Adesso» riporta in qualsiasi momento al tempo reale.","ab.h5":"Un istante preciso","ab.p5":"Il pulsante «📅 Data» apre una finestra in cui puoi scegliere una data di calendario esatta (ora in UTC, dai lanci a +1 miliardo di anni), un intervallo rispetto a oggi («tra 250 anni», «10 anni fa») o un istante rapido. Dopo la scelta, «Riproduci» continua da lì, a 1 anno al secondo. L’indirizzo della pagina riceve un marcatore <b>#t=<\/b> che si può salvare o inviare.","ab.h6":"Controlli","ab.p6":"Trascina sullo schermo per ruotare, rotellina / pizzico per lo zoom (disattiva lo zoom automatico), doppio clic per reimpostare l’angolo. Spazio = riproduci / pausa. Il riferimento «co-rotante» mostra la traiettoria nel sistema che ruota insieme alla Galassia.","ab.h7":"Il Golden Record","ab.p7":"Ogni sonda porta un disco di rame placcato in oro con suoni e immagini della Terra, come messaggio per un’eventuale scoperta in un futuro lontanissimo.","ab.src":"Fonte dei dati della missione: NASA/JPL. App in un unico file, funziona senza internet."},"es":{"title":"VOIAJOR — Voyager 1 y 2, del lanzamiento al futuro lejano","desc":"Simulación detallada de las trayectorias de las sondas Voyager 1 y 2, desde 1977 hasta más de mil millones de años en el futuro, a c 1.jup":"Paso más cercano: ≈349 000 km del centro del planeta. Descubre el vulcanismo de Io.","ev.v1.sat":"≈124 000 km. Sobrevuela Titán; la trayectoria asciende por encima del plano de los planetas.","ev.pbd.l":"Pale Blue Dot","ev.pbd.t":"«Pale Blue Dot»","ev.pbd.x":"El retrato de familia de los planetas, desde ≈40 UA.","ev.rec.l":"Récord","ev.rec.t":"El objeto fabricado por el ser humano más lejano","ev.rec.x":"Supera a la Pioneer 10 (≈69 UA).","ev.ts.t":"El choque de terminación","ev.v1.ts":"≈94 UA: el viento solar se frena bruscamente.","ev.hp.t":"La heliopausa","ev.v1.hp":"≈121,6 UA: la primera sonda que entra en el espacio interestelar.","ev.v2.launch":"Lanzada 16 días antes que la Voyager 1, en una trayectoria más lenta.","ev.v2.jup":"≈570 000 km del centro del planeta.","ev.v2.sat":"≈101 000 km; asistencia gravitatoria hacia Urano.","ev.v2.ura":"≈81 500 km. La única visita de una sonda.","ev.v2.nep":"≈4950 km sobre las nubes; después, Tritón. La trayectoria desciende hacia el sur.","ev.v2.ts":"≈84 UA.","ev.v2.hp":"≈119 UA: la segunda sonda en el espacio interestelar, con el instrumento de plasma en funcionamiento.","ev.ld.l":"1 día luz","ev.ldE.t":"1 día luz de la Tierra","ev.ldE.x":"Una señal de radio tarda 24 horas en un sentido. (Fecha calculada por el modelo; la NASA indicó noviembre de 2026 para este hito.)","ev.ldS.t":"1 día luz del Sol","ev.ldS.x":"≈173 UA del Sol (heliocéntrico).","ev.sil.l":"≈ años 2030","ev.sil.t":"Estimación: silencio de radio","ev.sil.x":"Los generadores de plutonio pierden ≈4 W al año; los instrumentos se apagan uno tras otro y las sondas se quedan sin transmisión. Datación orientativa.","ev.oort.l":"Nube de Oort","ev.oortIn.t":"Entrada en la Nube de Oort interior","ev.v1.oortIn":"≈1000 UA (dentro de ≈250 años).","ev.v2.oortIn":"≈1000 UA.","ev.oortOut.l":"Oort exterior","ev.oortOut.t":"La Nube de Oort exterior","ev.v1.oortOut":"≈20 000 UA.","ev.ly.l":"1 año luz","ev.ly.t":"1 año luz del Sol","ev.ly.x":"63 241 UA.","ev.oortEdge.l":"Borde de Oort","ev.oortEdge.t":"Salida de la Nube de Oort","ev.v1.oortEdge":"≈100 000 UA; la travesía dura ≈30 000 años.","ev.v2.oortEdge":"≈100 000 UA.","ev.p1m":"+1 millón de años","ev.p10m":"+10 millones de años","ev.p100m":"+100 millones de años","ev.p1b":"+1000 millones de años","ev.dyn":"V1 a {0} del Sol; V2 a {1} (modelo lineal + dinámica galáctica local).","ap.l":"→ {0}","ap.t":"Máximo acercamiento a {0}","ap.x":"≈{0} a. l. entre la sonda y la estrella (modelo, valores aproximados del catálogo).","ap.star":"Estrella","ap.when":"Cuándo","ap.dist":"Distancia","ap.lit":"Bibliografía y modelo","ap.pair":"Sonda · estrella","ap.litc":"Bibliografía","ap.modc":"Modelo","ap.note":"Bibliografía: NASA/JPL, a través de Wikipedia. A distancias de años luz, un error de unos pocos grados en la dirección de movimiento de una sonda cambia la distancia mínima en décimas de año luz o más (en el caso de Sirio, más de dos años luz), por lo que los valores del modelo son meramente orientativos.","ab.h1":"Qué muestra la aplicación","ab.p1":"Las trayectorias de las dos sondas Voyager desde 1977 hasta un futuro de hasta 1000 millones de años, a cualquier escala: de la órbita de la Tierra al disco de la Vía Láctea. El círculo de 1 día luz (≈173 UA) es el hito hacia el que se dirige la Voyager 1 en 2026–2027.","ab.h2":"Cómo se calcula","ab.p2":"<b>Planetas:<\/b> elementos orbitales keplerianos medios (JPL, válidos de 1800 a 2050). <b>Hasta el 5 nov. 2026:<\/b> arcos balísticos (cónicas heliocéntricas, problema de Lambert) desde el lanzamiento hasta cada planeta, en las fechas reales de los sobrevuelos; las asistencias gravitatorias aparecen como cambios bruscos de velocidad en el planeta. Después, una recta con deceleración por la gravedad solar, calibrada para alcanzar la posición del 5 nov. 2026. <b>Después de 2026:<\/b> movimiento inercial más la corrección del Sol y, a largo plazo, la atracción de la Galaxia mediante las ecuaciones epicíclicas de Hill, con las constantes de Oort A=15,3 y B=−11,9 km/s/kpc y una frecuencia vertical de ≈0,08 rad/Ma. <b>Estrellas:<\/b> posiciones J2000, paralaje, movimiento propio y velocidad radial aproximada, propagados con la misma dinámica.","ab.h3":"Límites","ab.p3":"Las posiciones de 2026 (distancia, dirección) son aproximaciones; a escala de años luz difieren de las efemérides del JPL. No se incluye la atracción de otros cuerpos ni correcciones de trayectoria; los sobrevuelos planetarios se tratan como puntos (cónicas empalmadas). El modelo galáctico es una linealización en torno a la órbita del Sol: preciso durante decenas de millones de años, orientativo a partir de cientos de millones de años, cuando las sondas están a kiloparsecs del Sol. Las fechas del fin de la transmisión son estimaciones, no predicciones oficiales.","ab.h4":"Fecha actual","ab.p4":"Al iniciarse, la aplicación se sincroniza con el reloj del dispositivo (modo «Tiempo real»): las fechas relativas («hace», «dentro de») y la marca «hoy» de la trayectoria se refieren al día de hoy. La posición de las sondas se extrapola a partir de la última posición calibrada (5 nov. 2026), válida para cualquier fecha posterior; el botón «Ahora» vuelve al tiempo real en cualquier momento.","ab.h5":"Un momento concreto","ab.p5":"El botón «📅 Fecha» abre una ventana en la que puedes elegir una fecha exacta del calendario (hora en UTC, desde los lanzamientos hasta +1000 millones de años), un intervalo respecto a hoy («dentro de 250 años», «hace 10 años») o un momento rápido. Tras elegir, «Reproducir» continúa desde ahí, a 1 año por segundo. La dirección de la página recibe una marca <b>#t=<\/b> que se puede guardar o enviar.","ab.h6":"Controles","ab.p6":"Arrastra por la pantalla para girar, rueda / pellizco para el zoom (esto desactiva el zoom automático), doble clic para restablecer el ángulo. Espacio = reproducir / pausa. El sistema «en corrotación» muestra la trayectoria en el sistema que gira junto con la Galaxia.","ab.h7":"El Disco de Oro","ab.p7":"Cada sonda lleva un disco de cobre chapado en oro con sonidos e imágenes de la Tierra, como mensaje para un posible hallazgo en un futuro muy lejano.","ab.src":"Fuente de los datos de la misión: NASA/JPL. Aplicación de un solo archivo que funciona sin internet."},"pt":{"title":"VOIAJOR — Voyager 1 e 2, do lançamento ao futuro distante","desc":"Simulação detalhada das trajetórias das sondas Voyager 1 e 2, de 1977 até mais de mil milhões de anos no futuro, a qualquer escala.","brand":"Voyager 1 · Voyager 2 — do lançamento ao futuro distante","b.data":"Dados","b.opt":"Opções","tab.tel":"Telemetria","tab.ev":"Eventos","tab.stars":"Estrelas","tab.about":"Sobre","tel.note":"Os valores referem-se ao momento simulado. Depois de 2026, tudo é extrapolação.","ev.all":"Ambas","ev.both":"Ambas as sondas","st.h1":"Maiores aproximações a estrelas (modelo, a partir de 2026)","st.calc":"A calcular…","st.h2":"Estrelas mais próximas do Sol no momento simulado","o.h1":"Visualização","o.orb":"Órbitas dos planetas","o.lab":"Legendas","o.hel":"Heliosfera (onda de choque de terminação, heliopausa)","o.oort":"Nuvem de Oort","o.star":"Estrelas próximas","o.ring":"Círculos de distância (dias-luz, anos-luz)","o.fut":"Trajetória futura (a tracejado)","o.gal":"Galáxia (em grandes escalas)","o.auto":"Zoom automático (segue as sondas)","o.cor":"Referencial em co-rotação com a Galáxia","o.h2":"Centro da vista","o.sun":"O Sol","o.mid":"Ponto médio entre as sondas","o.reset":"Repor o ângulo de vista","o.lang":"Idioma","g.title":"Ir para um momento específico","g.close":"Fechar","g.date":"Data do calendário (hora em UTC)","g.day":"Dia","g.month":"Mês","g.year":"Ano","g.hour":"Hora","g.go":"Ir para a data","g.rel":"Relativo a hoje","g.after":"daqui a","g.before":"há","g.ud":"dias","g.umo":"meses","g.uy":"anos","g.uky":"milhares de anos","g.umy":"milhões de anos","g.uby":"mil milhões de anos","g.go2":"Ir","g.quick":"Momentos rápidos","g.bad":"Valor inválido.","g.pre":"Antes dos lançamentos não havia sond  de Oort","ev.oortIn.t":"Entrada na Nuvem de Oort interior","ev.v1.oortIn":"≈1000 UA (dentro de ≈250 anos).","ev.v2.oortIn":"≈1000 UA.","ev.oortOut.l":"Oort exterior","ev.oortOut.t":"A Nuvem de Oort exterior","ev.v1.oortOut":"≈20 000 UA.","ev.ly.l":"1 ano-luz","ev.ly.t":"1 ano-luz do Sol","ev.ly.x":"63 241 UA.","ev.oortEdge.l":"Limite de Oort","ev.oortEdge.t":"Saída da Nuvem de Oort","ev.v1.oortEdge":"≈100 000 UA; a travessia demora ≈30 000 anos.","ev.v2.oortEdge":"≈100 000 UA.","ev.p1m":"+1 milhão de anos","ev.p10m":"+10 milhões de anos","ev.p100m":"+100 milhões de anos","ev.p1b":"+1 mil milhões de anos","ev.dyn":"V1 a {0} do Sol; V2 a {1} (modelo linear + dinâmica galáctica local).","ap.l":"→ {0}","ap.t":"Maior aproximação a {0}","ap.x":"≈{0} a.l. entre a sonda e a estrela (modelo, valores aproximados do catálogo).","ap.star":"Estrela","ap.when":"Quando","ap.dist":"Distância","ap.lit":"Literatura vs. modelo","ap.pair":"Sonda · estrela","ap.litc":"Literatura","ap.modc":"Modelo","ap.note":"Literatura: NASA/JPL, via Wikipédia. A distâncias de anos-luz, um erro de poucos graus na direção de movimento de uma sonda altera a distância mínima em décimas de ano-luz ou mais (para Sírio, mais de dois anos-luz), pelo que os valores do modelo são meramente indicativos.","ab.h1":"O que a aplicação mostra","ab.p1":"Os percursos das duas sondas Voyager de 1977 até um futuro a 1 mil milhões de anos, a qualquer escala: da órbita da Terra ao disco da Via Láctea. O círculo de 1 dia-luz (≈173 UA) é o marco para o qual a Voyager 1 se dirige em 2026–2027.","ab.h2":"Como é calculado","ab.p2":"<b>Planetas:<\/b> elementos orbitais keplerianos médios (JPL, válidos para 1800–2050). <b>Até 5 nov 2026:<\/b> arcos balísticos (cónicas heliocêntricas, problema de Lambert) do lançamento a cada planeta, nas datas reais de sobrevoo; as assistências gravitacionais surgem como variações bruscas de velocidade junto ao planeta. Depois, uma reta com desaceleração gravitacional solar, calibrada para atingir a posição de 5 nov 2026. <b>Após 2026:<\/b> movimento inercial com a correção do Sol e, a longo prazo, a atração da Galáxia através das equações epicíclicas de Hill, com as constantes de Oort A=15,3 e B=−11,9 km/s/kpc e uma frequência vertical de ≈0,08 rad/Ma. <b>Estrelas:<\/b> posições J2000, paralaxe, movimento próprio e velocidade radial aproximada, propagados com a mesma dinâmica.","ab.h3":"Limites","ab.p3":"As posições de 2026 (distância, direção) são aproximações; à escala de anos-luz diferem das efemérides do JPL. Não se consideram a atração de outros corpos nem correções de trajetória; os sobrevoos planetários são tratados como pontos (cónicas ajustadas). O modelo galáctico é uma linearização em torno da órbita do Sol: preciso ao longo de dezenas de milhões de anos, indicativo a partir de centenas de milhões de anos, quando as sondas estão a quiloparsecs do Sol. As datas do fim das transmissões são estimativas, não previsões oficiais.","ab.h4":"Data atual","ab.p4":"Ao iniciar, a aplicação sincroniza-se com o relógio do dispositivo (modo «Tempo real»): as datas relativas («há», «daqui a») e a marca «hoje» no percurso referem-se ao dia de hoje. A posição das sondas é extrapolada a partir da última posição calibrada (5 nov 2026), válida para qualquer data posterior; o botão «Agora» regressa ao tempo real em qualquer momento.","ab.h5":"Um momento específico","ab.p5":"O botão «📅 Data» abre uma janela onde pode escolher uma data exata do calendário (hora em UTC, dos lançamentos a +1 mil milhões de anos), um intervalo relativo a hoje («daqui a 250 anos», «há 10 anos») ou um momento rápido. Depois de escolher, «Reproduzir» continua a partir daí, a 1 ano por segundo. O endereço da página ganha um marcador <b>#t=<\/b> que pode ser guardado ou enviado.","ab.h6":"Controlos","ab.p6":"Arraste no ecrã para rodar, roda do rato / pinça para ampliar (isto desativa o zoom automático), duplo clique para repor o ângulo. Espaço = reproduzir / pausar. O referencial «em co-rotação» mostra o percurso no sistema que roda com a Galáxia.","ab.h7":"O Disco de Ouro","ab.p7":"Cada sonda transporta um disco de cobre banhado a ouro com sons e imagens da Terra, como mensagem para uma possível descoberta num futuro muito distante.","ab.src":"Fonte dos dados da missão: NASA/JPL. Aplicação de ficheiro único que funciona sem internet."},"de":{"title":"VOIAJOR — Voyager 1 und 2, vom Start bis in die ferne Zukunft","desc":"Eine detaillierte Simulation der Bahnen von Voyager 1 und 2, von 1977 bis über eine Milliarde Jahre in die Zukunft, in jedem Maßstab.","brand":"Voyager 1 · Voyager 2 — vom Start bis in die ferne Zukunft","b.data":"Daten","b.opt":"Optionen","tab.tel":"Telemetrie","tab.ev":"Ereignisse","tab.stars":"Sterne","tab.about":"Info","tel.note":"Die Werte beziehen sich auf den simulierten Zeitpunkt. Nach 2026 ist alles Extrapolation.","ev.all":"Beide","ev.both":"Beide Sonden","st.h1":"Größte Annäherungen an Sterne (Modell, ab 2026)","st.calc":"Berechnung…","st.h2":"Der Sonne nächste Sterne zum simulierten Zeitpunkt","o.h1":"Anzeige","o.orb":"Planetenbahnen","o.lab":"Beschriftungen","o.hel":"Heliosphäre (Termination Shock, Heliopause)","o.oort":"Oortsche Wolke","o.star":"Nahe Sterne","o.ring":"Entfernungskreise (Lichttage, Lichtjahre)","o.fut":"Künftige Bahn (gepunktet)","o.gal":"Galaxis (bei großen Maßstäben)","o.auto":"Auto-Zoom (folgt den Sonden)","o.cor":"Mit der Galaxis mitrotierendes System","o.h2":"Bildmitte","o.sun":"Die Sonne","o.mid":"Mitte zwischen den Sonden","o.reset":"Blickwinkel zurücksetzen","o.lang":"Sprache","g.title":"Zu einem bestimmten Zeitpunkt","g.close":"Schließen","g.date":"Kalenderdatum (Uhrzeit in UTC)","g.day":"Tag","g.month":"Monat","g.year":"Jahr","g.hour":"Uhrzeit","g.go":"Zum Datum","g.rel":"Relativ zu heute","g.after":"in","g.before":"vor","g.ud":"Tagen","g.umo":"Monaten","g.uy":"Jahren","g.uky":"Tausend Jahren","g.umy":"Mio. Jahren","g.uby":"Mrd. Jahren","g.go2":"Los","g.quick":"Schnellauswahl","g.bad":"Ungültiger  innere Oortsche Wolke","ev.v1.oortIn":"≈1.000 AE (in ≈250 Jahren).","ev.v2.oortIn":"≈1.000 AE.","ev.oortOut.l":"Äußere Oort","ev.oortOut.t":"Die äußere Oortsche Wolke","ev.v1.oortOut":"≈20.000 AE.","ev.ly.l":"1 Lichtjahr","ev.ly.t":"1 Lichtjahr von der Sonne","ev.ly.x":"63.241 AE.","ev.oortEdge.l":"Oort-Rand","ev.oortEdge.t":"Verlassen der Oortschen Wolke","ev.v1.oortEdge":"≈100.000 AE; die Durchquerung dauert ≈30.000 Jahre.","ev.v2.oortEdge":"≈100.000 AE.","ev.p1m":"+1 Million Jahre","ev.p10m":"+10 Millionen Jahre","ev.p100m":"+100 Millionen Jahre","ev.p1b":"+1 Milliarde Jahre","ev.dyn":"V1 in {0} Entfernung von der Sonne; V2 in {1} (lineares Modell + lokale galaktische Dynamik).","ap.l":"→ {0}","ap.t":"Größte Annäherung an {0}","ap.x":"≈{0} Lj zwischen Sonde und Stern (Modell, ungefähre Katalogwerte).","ap.star":"Stern","ap.when":"Wann","ap.dist":"Abstand","ap.lit":"Literatur vs. Modell","ap.pair":"Sonde · Stern","ap.litc":"Literatur","ap.modc":"Modell","ap.note":"Literatur: NASA/JPL, via Wikipedia. Über Lichtjahre hinweg verändert eine Abweichung von wenigen Grad in der Bewegungsrichtung einer Sonde den Mindestabstand um Zehntel Lichtjahre oder mehr (bei Sirius um über zwei Lichtjahre); die Modellwerte sind daher nur Richtwerte.","ab.h1":"Was die App zeigt","ab.p1":"Die Bahnen der beiden Voyager-Sonden von 1977 bis in eine bis zu 1 Milliarde Jahre ferne Zukunft, in jedem Maßstab: von der Erdbahn bis zur Scheibe der Milchstraße. Der Kreis von 1 Lichttag (≈173 AE) ist der Meilenstein, auf den Voyager 1 in den Jahren 2026–2027 zusteuert.","ab.h2":"Wie es berechnet wird","ab.p2":"<b>Planeten:<\/b> mittlere Keplersche Bahnelemente (JPL, gültig 1800–2050). <b>Bis 5. Nov. 2026:<\/b> ballistische Bögen (heliozentrische Kegelschnitte, Lambert-Problem) vom Start zu jedem Planeten, zu den tatsächlichen Vorbeiflugdaten; Swing-by-Manöver erscheinen als plötzliche Geschwindigkeitsänderungen am Planeten. Danach eine Gerade mit gravitativer Abbremsung durch die Sonne, kalibriert auf die Position vom 5. Nov. 2026. <b>Nach 2026:<\/b> Trägheitsbewegung plus Korrektur durch die Sonne, auf lange Sicht die Anziehung der Galaxis über die epizyklischen Hill-Gleichungen mit den Oortschen Konstanten A=15,3 und B=−11,9 km/s/kpc und einer vertikalen Frequenz von ≈0,08 rad/Mio. Jahre. <b>Sterne:<\/b> J2000-Positionen, Parallaxe, Eigenbewegung und ungefähre Radialgeschwindigkeit, mit derselben Dynamik fortgeschrieben.","ab.h3":"Grenzen","ab.p3":"Die Positionen für 2026 (Entfernung, Richtung) sind Näherungen; im Lichtjahr-Maßstab weichen sie von den JPL-Ephemeriden ab. Keine Anziehung durch andere Körper und keine Bahnkorrekturen; Planetenvorbeiflüge werden als Punkte behandelt (Patched Conics). Das Galaxienmodell ist eine Linearisierung um die Sonnenbahn: genau über zehn Millionen Jahre, ab Hunderten Millionen Jahren nur noch ein Richtwert, wenn die Sonden Kiloparsec von der Sonne entfernt sind. Die Daten zum Ende der Übertragung sind Schätzungen, keine offiziellen Prognosen.","ab.h4":"Aktuelles Datum","ab.p4":"Beim Start synchronisiert sich die App mit der Geräteuhr (Modus „Echtzeit“): relative Angaben („vor“, „in“) und die Markierung „heute“ auf der Bahn beziehen sich auf den heutigen Tag. Die Sondenposition wird von der zuletzt kalibrierten Position (5. Nov. 2026) aus extrapoliert, gültig für jedes spätere Datum; die Schaltfläche „Jetzt“ kehrt jederzeit zur Echtzeit zurück.","ab.h5":"Ein bestimmter Zeitpunkt","ab.p5":"Die Schaltfläche „📅 Datum“ öffnet ein Fenster, in dem du ein genaues Kalenderdatum (Uhrzeit in UTC, von den Starts bis +1 Milliarde Jahre), ein Intervall relativ zu heute („in 250 Jahren“, „vor 10 Jahren“) oder einen Schnellmoment wählen kannst. Nach der Auswahl läuft „Abspielen“ von dort weiter, mit 1 Jahr pro Sekunde. Die Seitenadresse erhält eine Markierung <b>#t=<\/b>, die du speichern oder weitergeben kannst.","ab.h6":"Steuerung","ab.p6":"Ziehen auf dem Bildschirm dreht die Ansicht, Mausrad / Pinch zoomt (das schaltet den Auto-Zoom aus), Doppelklick setzt den Winkel zurück. Leertaste = Abspielen / Pause. Das „mitrotierende“ System zeigt die Bahn in dem System, das sich mit der Galaxis dreht.","ab.h7":"Die Goldene Schallplatte","ab.p7":"Jede Sonde trägt eine vergoldete Kupferscheibe mit Klängen und Bildern der Erde, als Botschaft für eine mögliche Entdeckung in ferner Zukunft.","ab.src":"Quelle der Missionsdaten: NASA/JPL. Eine App in einer einzigen Datei, die ohne Internet funktioniert."},"hu":{"title":"VOIAJOR — a Voyager–1 és –2 a kilövéstől a távoli jövőig","desc":"A Voyager–1 és a Voyager–2 pályájának részletes szimulációja 1977-től több mint egymilliárd évvel előre, tetszőleges léptékben.","brand":"Voyager 1 · Voyager 2 — a kilövéstől a távoli jövőig","b.data":"Adatok","b.opt":"Beállítások","tab.tel":"Telemetria","tab.ev":"Események","tab.stars":"Csillagok","tab.about":"Névjegy","tel.note":"Az értékek a szimulált pillanatra vonatkoznak. 2026 után minden extrapoláció.","ev.all":"Mindkettő","ev.both":"Mindkét szonda","st.h1":"Legkisebb távolságú csillagközeli elhaladások (modell, 2026-tól)","st.calc":"Számítás…","st.h2":"A Naphoz legközelebbi csillagok a szimulált pillanatban","o.h1":"Megjelenítés","o.orb":"Bolygópályák","o.lab":"Feliratok","o.hel":"Helioszféra (lökéshullám-határ, heliopauza)","o.oort":"Oort-felhő","o.star":"Közeli csillagok","o.ring":"Távolságkörök (fénynap, fényév)","o.fut":"Jövőbeli pálya (pontozott)","o.gal":"Galaxis (nagy léptékben)","o.auto":"Automatikus nagyítás (követi a szondákat)","o.cor":"A Galaxissal együtt forgó vonatkoztatási rendszer","o.h2":"Nézet középpontja","o.sun":"A Nap","o.mid":"A két szonda felezőpontja","o.reset":"Nézőszög visszaállítása","o.lang":"Nyelv","g.title":"Ugrás egy adott pillanatra","g.close":"Bezárás","g.date":"Naptári dátum (idő UTC szerint)","g.day":"Nap","g.month":"Hónap","g.year":"Év","g.hour":"Idő","g.go":"Ugrás a dátumra","g.rel":"A mai naphoz képest","g.after":"múlva","g.before":"ezelőtt","g.ud":"nap","g.umo":"hónap","g.uy":"év", elhő","ev.oortIn.t":"Belépés a belső Oort-felhőbe","ev.v1.oortIn":"≈1 000 CsE (≈250 év múlva).","ev.v2.oortIn":"≈1 000 CsE.","ev.oortOut.l":"Külső Oort","ev.oortOut.t":"A külső Oort-felhő","ev.v1.oortOut":"≈20 000 CsE.","ev.ly.l":"1 fényév","ev.ly.t":"1 fényév a Naptól","ev.ly.x":"63 241 CsE.","ev.oortEdge.l":"Oort pereme","ev.oortEdge.t":"Kilépés az Oort-felhőből","ev.v1.oortEdge":"≈100 000 CsE; az áthaladás ≈30 000 évig tart.","ev.v2.oortEdge":"≈100 000 CsE.","ev.p1m":"+1 millió év","ev.p10m":"+10 millió év","ev.p100m":"+100 millió év","ev.p1b":"+1 milliárd év","ev.dyn":"V1 a Naptól {0} távolságban; V2 {1} távolságban (lineáris modell + helyi galaktikus dinamika).","ap.l":"→ {0}","ap.t":"Legkisebb távolság: {0}","ap.x":"≈{0} fé a szonda és a csillag között (modell, hozzávetőleges katalógusértékek).","ap.star":"Csillag","ap.when":"Mikor","ap.dist":"Távolság","ap.lit":"Szakirodalom és modell","ap.pair":"Szonda · csillag","ap.litc":"Szakirodalom","ap.modc":"Modell","ap.note":"Szakirodalom: NASA/JPL, a Wikipédián keresztül. Fényévnyi távolságokon a szonda mozgásirányának néhány fokos eltérése tized fényévvel vagy még többel módosítja a minimális távolságot (a Szíriusz esetében két fényévnél is többel), ezért a modell értékei csak tájékoztató jellegűek.","ab.h1":"Mit mutat az alkalmazás","ab.p1":"A két Voyager-szonda útját 1977-től egészen 1 milliárd évvel későbbi jövőig, tetszőleges léptékben: a Föld pályájától a Tejútrendszer korongjáig. Az 1 fénynapos kör (≈173 CsE) az a mérföldkő, amely felé a Voyager 1 2026–2027-ben tart.","ab.h2":"Hogyan számoljuk","ab.p2":"<b>Bolygók:<\/b> közepes Kepler-féle pályaelemek (JPL, 1800–2050 között érvényesek). <b>2026. nov. 5-ig:<\/b> ballisztikus ívek (heliocentrikus kúpszeletek, Lambert-feladat) a kilövéstől minden bolygóig, a valódi elhaladási dátumokkal; a gravitációs hintamanőverek a bolygónál hirtelen sebességváltozásként jelennek meg. Ezután egyenes vonal a Nap gravitációs lassításával, úgy kalibrálva, hogy elérje a 2026. nov. 5-i pozíciót. <b>2026 után:<\/b> tehetetlenségi mozgás a Nap korrekciójával, hosszú távon pedig a Galaxis vonzása az epiciklikus (Hill-féle) egyenleteken keresztül, A=15,3 és B=−11,9 km/s/kpc Oort-állandókkal és ≈0,08 rad/millió év függőleges frekvenciával. <b>Csillagok:<\/b> J2000 pozíciók, parallaxis, sajátmozgás és hozzávetőleges radiális sebesség, ugyanazzal a dinamikával továbbvezetve.","ab.h3":"Korlátok","ab.p3":"A 2026-os pozíciók (távolság, irány) közelítések; fényévnyi léptékben eltérnek a JPL efemeridáitól. Nincs más égitestek vonzása és pályakorrekció; a bolygók melletti elhaladásokat pontszerűnek tekintjük (összeillesztett kúpszeletek). A galaktikus modell a Nap pályája körüli linearizálás: több tízmillió évre pontos, több száz millió évtől már csak tájékoztató jellegű, amikor a szondák kiloparszekekre vannak a Naptól. Az adás megszűnésére vonatkozó időpontok becslések, nem hivatalos előrejelzések.","ab.h4":"Aktuális dátum","ab.p4":"Indításkor az alkalmazás szinkronizálja magát az eszköz órájával („Valós idő” mód): a relatív dátumok („ezelőtt”, „múlva”) és a pályán látható „ma” jelölés a mai napra vonatkoznak. A szondák helyzetét az utolsó kalibrált pozícióból (2026. nov. 5.) extrapoláljuk, bármely későbbi dátumra érvényesen; a „Most” gomb bármikor visszatér a valós időhöz.","ab.h5":"Egy adott pillanat","ab.p5":"A „📅 Dátum” gomb egy ablakot nyit, ahol pontos naptári dátumot (UTC szerinti idővel, a kilövésektől +1 milliárd évig), a mai naphoz viszonyított időközt („250 év múlva”, „10 évvel ezelőtt”) vagy egy gyors pillanatot választhatsz. A választás után a „Lejátszás” onnan folytatódik, másodpercenként 1 évvel. Az oldal címe egy <b>#t=<\/b> jelölést kap, amelyet elmenthetsz vagy elküldhetsz.","ab.h6":"Vezérlők","ab.p6":"Húzással forgathatsz, görgővel / csippentéssel nagyíthatsz (ez kikapcsolja az automatikus nagyítást), dupla kattintással visszaállíthatod a szöget. Szóköz = lejátszás / szünet. Az „együtt forgó” rendszer a pályát a Galaxissal együtt forgó vonatkoztatási rendszerben mutatja.","ab.h7":"Az Aranylemez","ab.p7":"Mindkét szonda egy aranyozott rézlemezt hordoz a Föld hangjaival és képeivel, üzenetként egy esetleges felfedezés számára a nagyon távoli jövőben.","ab.src":"A küldetési adatok forrása: NASA/JPL. Egyetlen fájlból álló alkalmazás, internet nélkül is működik."}};/*I18N-END*/</script>
<script>
(function(){

const cv=$('cv'),ctx=cv.getContext('2d');
const TMIN=Math.min(V1.launch,V2.launch)-0.01, YNOW=TAU0-TMIN, TMAX=TAU0+1e9;
function nowTau(){return ((Date.now()/86400000+2440587.5)-2451545)/365.25;}
const clampT=t=>Math.min(TMAX,Math.max(TMIN,t));

// ---------- limbă / formatare ----------
const LANGS=[['en','EN','English','en-US'],['ro','RO','Română','ro-RO'],['fr','FR','Français','fr-FR'],['it','IT','Italiano','it-IT'],['es','ES','Español','es-ES'],['pt','PT','Português','pt-PT'],['de','DE','Deutsch','de-DE'],['hu','HU','Magyar','hu-HU']];
let LANG='en',LOC='en-US',MOS=[],MOL=[];
function tr(k,...a){const d=I18N[LANG]||{};let s=d[k];if(s==null)s=(I18N.en||{})[k];if(s==null)s=(I18N.ro||{})[k];if(s==null)s=k;return String(s).replace(/\{(\d+)\}/g,(m,i)=>a[+i]!=null?a[+i]:'');}
const trList=k=>tr(k).split(', ');
const pn=i=>tr('pl.'+i);
const SKEY={'Steaua lui Barnard':'st.barnard'};
const starName=s=>SKEY[s.name]?tr(SKEY[s.name]):s.name;
const rs=(x,e)=>typeof x==='function'?x(e):tr(x);
function nf(x,d){d=d||0;try{return x.toLocaleString(LOC,{minimumFractionDigits:d,maximumFractionDigits:d});}catch(e){return x.toFixed(d);}}
// formă de plural: "sg|pl" (ro: "sg|pl|de pl"); dec = număr zecimal afișat (mereu plural)
function pl(n,key,dec){const f=tr(key).split('|'),k=Math.abs(Math.round(n));
  if(LANG==='hu')return f[0];
  if(LANG==='ro'){if(dec||k===0)return f[1];const m=k%100;return (m===0||m>=20)?f[2]:(k===1?f[0]:f[1]);}
  if(LANG==='fr')return (!dec&&k<2)?f[0]:f[1];
  return (!dec&&k===1)?f[0]:f[1];}
const lyS=(x,d)=>nf(x,d)+' '+tr('u.ly');
function fmtBig(n){const a=Math.abs(n);if(a>=1e9||Math.round(a/1e6)>=1000)return nf(n/1e9,a<1e10?2:1)+' '+tr('u.bn');if(a>=1e6||Math.round(a/1e3)>=1000)return nf(n/1e6,a<1e7?2:1)+' '+tr('u.mn');if(a>=1e4)return nf(n/1e3,0)+' '+tr('u.k');return nf(n,0);}
function fmtTick(n){return n>=1e9?nf(n/1e9,0)+' '+tr('tk.bn'):n>=1e6?nf(n/1e6,0)+' '+tr('tk.mn'):n>=1e4?nf(n/1e3,0)+' '+tr('tk.k'):nf(n,0);}
const dmy=c=>tr('date.fmt',Math.floor(c.d),MOS[c.m-1],c.y);
function fmtDate(tau){
  if(tau<=1000)return dmy(M.calFromJD(2451545+tau*365.25));
  const yr=2000+tau;
  if(tau<=2e5)return tr('date.year',nf(Math.round(yr),0));
  return tr('rel.fut',tr('u.ybig',fmtBig(tau)));}
function fmtDateTime(tau){if(tau>1000)return fmtDate(tau);const c=M.calFromJD(2451545+tau*365.25),H=Math.floor(c.h),Mi=Math.floor((c.h-H)*60),p=n=>(n<10?'0':'')+n;return tr('date.time',dmy(c),p(H)+':'+p(Mi));}
function relNow(tau){const dn=tau-nowTau(),a=Math.abs(dn),d=a*365.25;if(d<0.5)return tr('rel.today');
  const s=d<1.5?tr('rel.oneday'):d<400?nf(d,0)+' '+pl(d,'ru.day'):a<2e5?(a<10?nf(a,1)+' '+pl(a,'ru.year',1):nf(a,0)+' '+pl(a,'ru.year')):tr('u.ybig',fmtBig(a));
  return tr(dn<0?'rel.past':'rel.fut',s);}

  uiT+=dt;if(uiT>0.1){uiT=0;if(document.activeElement!==$('tSl'))$('tSl').value=pOfTau(S.tau);if(document.activeElement!==$('zSl'))$('zSl').value=S.logW;}
  telT+=dt;if(telT>0.2){telT=0;updTel();}}
// ---------- aplicarea limbii ----------
function applyLang(l){
  if(!I18N[l])l='en';LANG=l;LOC=LANGS.find(x=>x[0]===l)[3];MOS=trList('mo.s');MOL=trList('mo.l');
  document.documentElement.lang=l;document.title=tr('title');
  const md=document.querySelector('meta[name=description]');if(md)md.setAttribute('content',tr('desc'));
  document.querySelectorAll('[data-i]').forEach(e=>{e.innerHTML=tr(e.dataset.i);});
  document.querySelectorAll('[data-ia]').forEach(e=>e.dataset.ia.split(';').forEach(q=>{const i=q.indexOf(':');e.setAttribute(q.slice(0,i),tr(q.slice(i+1)));}));
  fillRates();fillZ();buildTicks();buildRings();fillMonths();fillChips();renderAbout();setPlay(S.play);gMsg('');
  [...$('lang').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===l?'true':'false'));
  try{localStorage.setItem('voiajor.lang',l);}catch(e){}
  ['dateBig','dateSub','tLabel','scaleTxt'].forEach(i=>{$(i)._t=null;});
  renderEv();renderAppr();updTel();measure();lastKey='';layout();}
(function(){const bar=$('lang');
  LANGS.forEach(x=>{const b=document.createElement('button');b.type='button';b.textContent=x[1];b.dataset.l=x[0];b.lang=x[0];b.title=x[2];b.setAttribute('aria-label',x[2]);b.onclick=()=>applyLang(x[0]);bar.appendChild(b);});
  let l=null;
  try{const q=new URLSearchParams(location.search).get('lang');if(q&&I18N[q])l=q;}catch(e){}
  try{if(!l){const v=localStorage.getItem('voiajor.lang');if(v&&I18N[v])l=v;}}catch(e){}
  if(!l){for(const n of (navigator.languages||[navigator.language||'en'])){const c=String(n).slice(0,2).toLowerCase();if(I18N[c]){l=c;break;}}}
  applyLang(l||'en');})();

modeClasses();S.side=!compact&&!sheet;
resize();applySide();S.mode='live';S.tau=clampT(nowTau());const hp=parseHash();if(hp!==null){S.tau=clampT(hp);S.mode='rate';S.rate=1;selRate.value=5;}
renderEv();syncUI();updTel();setPlay(hp===null);
$('tLabel').textContent='';
requestAnimationFrame(frame);
setTimeout(computeApproaches,400);
})();
